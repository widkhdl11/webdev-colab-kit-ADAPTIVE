      <stop offset="0" stop-color="#16223F"/><stop offset=".5" stop-color="#2F4479"/><stop offset=".82" stop-color="#6F8CC6"/><stop offset="1" stop-color="#A9BFE6"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF8E1"/><stop offset=".6" stop-color="#FDECB2" stop-opacity=".9"/><stop offset="1" stop-color="#FDECB2" stop-opacity="0"/>
