];
const PAST = [
  { n: "모카", f: "--face-4", t: "중형", no: "FC-6B2N8", tag: "받지 않음", tone: "danger", note: "선물 수령을 거절했습니다" },
  { n: "새벽라디오", f: "--face-6", t: "소형", no: "FC-3H7V4", tag: "기한 만료", tone: "danger", note: "수락 기한(7일)이 지났습니다" },
  { n: "달빛정원", f: "--face-1", t: "대형", no: "FC-8A5C6", tag: "반송 완료", tone: "danger", note: "크리에이터에게 반송했습니다" },
  { n: "소담", f: "--face-2", t: "소형", no: "FC-1Z9L3", tag: "처분 완료", tone: "danger", note: "상자 처분이 완료되었습니다" },
  { n: "윤슬", f: "--face-5", t: "중형", no: "FC-5M4W7", tag: "취소", tone: "plain", note: "취소된 선물입니다" },
];
const SETS = { full: [ONGOING, PAST], onlyPast: [[], PAST], onlyOngoing: [ONGOING, []], none: [[], []] };
const STATES = { list: ["full", 0], past: ["full", 1], empty: ["none", 0], ongoing0: ["onlyPast", 0], past0: ["onlyOngoing", 1] };
const NOTE = '<p class="past-note">수락하지 않은 선물은 크리에이터에게 반송됩니다. 수락하지 않은 이유는 크리에이터에게 공개하지 않습니다.</p>';
const $ = (id) => document.getElementById(id);
let ds = "full", tab = 0;

const who = (c, strong) => `<div class="who"><span class="face" aria-hidden="true"><img class="pf" src="../../../../public/img/default-face/cat.webp" alt="" aria-hidden="true"></span><div>${strong}<span class="meta">${c.t} 상자 · 주문번호 ${c.no}</span><span class="tag tag--${c.st === "wait" ? "warn" : c.tone}">${c.st === "wait" ? "수락 대기" : c.tag}</span></div></div>`;
function card(c) {
  const name = `${c.n}님이 보낸 선물`;
  if (c.st === "wait") {
    return `<li><article class="rcard wait" aria-labelledby="r-${c.no}">${who(c, `<strong id="r-${c.no}">${name}</strong>`)}
      <div class="foot"><p class="days"><b>${c.d}일<small>남음</small></b><span class="lab">${c.until}까지</span></p><a class="btn btn--sm" href="#" aria-label="${name} 받기 — 확인하기">확인하기</a></div></article></li>`;
  }
  return `<li><article class="rcard">${who(c, `<strong><a class="stretch" href="#">${name}</a></strong>`)}
    <div class="foot"><p class="note">${c.note}</p>${CHEV}</div></article></li>`;
}
function render() {
  const [on, pa] = SETS[ds], none = ds === "none";
  $("tabs").hidden = none; $("empty").hidden = !none; $("results").hidden = none;
  $("tabs").innerHTML = [["ongoing", "받는 중", on.length], ["past", "완료", pa.length]].map(([id, l, n], i) =>
    `<button class="tab" role="tab" type="button" id="tab-${id}" data-tab="${i}" aria-selected="${i === tab}" aria-controls="results" tabindex="${i === tab ? 0 : -1}">${l} ${n}</button>`).join("");
  const rows = tab === 0 ? on : pa;
  $("results").setAttribute("aria-labelledby", tab === 0 ? "tab-ongoing" : "tab-past");
  $("results").innerHTML = (rows.length
    ? `<ul class="grid">${rows.map(card).join("")}</ul>`
    : `<div class="status small"><p>${tab === 0 ? "받는 중인 선물이 없습니다." : "완료된 선물이 없습니다."}</p></div>`) + (tab === 1 ? NOTE : "");
  const key = Object.keys(STATES).find((k) => STATES[k][0] === ds && STATES[k][1] === tab);
  document.querySelectorAll("#tools button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === key)));
  if (key) history.replaceState(null, "", "#" + key);
}
function setState(k) { [ds, tab] = STATES[k]; render(); }
document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-s]"); if (s) { setState(s.dataset.s); return; }
  const t = e.target.closest("[data-tab]"); if (t) { tab = Number(t.dataset.tab); render(); $("tab-" + (tab ? "past" : "ongoing")).focus(); }
});
$("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault(); tab = 1 - tab; render(); $("tab-" + (tab ? "past" : "ongoing")).focus();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (STATES[h]) setState(h); });
const h0 = location.hash.slice(1); if (STATES[h0]) [ds, tab] = STATES[h0];
render();
</script>
</body>
</html>
