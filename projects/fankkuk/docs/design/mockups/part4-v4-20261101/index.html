<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬꾹 4파트 설정 계열 여덟 화면 · 시안 4 기준으로 맞춘 비교</title>
<!--
  2026-11-01 요청: 4파트(팬 /me · /me/profile · /me/following · /me/email/confirm, 크리에이터 /creator/account · /creator/settings · /creator/profile · /creator/customize)를
  시안 4 설계 기준(design-prompt.md)과 design-rules 34~40절로 다시 맞춘 비교. 문구 · 칸 순서 · 노출 조건은 지금 코드 그대로, 모양(배치 · 위계 · 간격 · 색 · 경계 · 정렬)만 다뤘다.
  탭 여덟 · 서른세 상태 × PC 1440 · 휴대폰 390. 「지금」은 캡처(now/)가 있는 여덟 상태는 캡처 그대로, 나머지는 코드의 CSS 값(my-info · fan-profile-edit · my-following · confirm-email · creator-account ·
  creator-settings · fandom-section · creator-profile-edit · creator-customize 의 *.module.css 와 base.css)으로 같은 틀에 다시 그린 「지금(재현)」이다. 시드에 없는 상태가 재현이다.
  오류 · 완료 상자의 문장은 상태 모양을 보이려는 예시다(코드 문장과 같지 않을 수 있음). 저장 줄은 휴대폰에서 화면 아래에 붙지만 시안은 제자리에 그렸다. 캡처의 가운데 떠 있는 저장 줄은 전체 페이지 캡처 때문이다.
  왼쪽 메뉴는 범위 밖이라 펼친 240 으로 단순화. 값은 src/shared/ui/tokens.css 토큰 그대로. 폰트 · 그림은 assets/ (node scripts/preview.mjs fankkuk 으로 열린다).
  _src/ 는 이 파일을 만든 원본 조각이다(build.mjs 로 합침).
-->
<style>
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Medium.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Bold.woff') format('woff');font-weight:700 800;font-display:swap}
@font-face{font-family:Tmoney;src:url('assets/TmoneyRoundWindExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--ink:#1F2937;--sub:#4B5563;--muted:#55606E;--line:#DCE3EA}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:var(--ink);font:500 16px/1.6 Pretendard,system-ui,sans-serif;word-break:keep-all}
h1,h2,h3,p,ul,ol,dl,dd,dt{margin:0}
ul,ol{padding:0;list-style:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ===== 비교 페이지 틀 ===== */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.top h1{font:800 18px/1.3 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;margin-right:auto}
.seg{display:flex;gap:4px;padding:4px;background:#E6EBF0;border-radius:12px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.15);font-weight:700}
.seg-label{font-size:14px;color:var(--muted);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px}
.cmp{padding:24px}
.changes{max-width:1100px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.changes h2{font:800 20px/1.3 Tmoney,Pretendard,sans-serif;margin-bottom:8px}
.changes h2 span{font:500 14px Pretendard;color:var(--muted);margin-left:8px}
.changes h4{margin:12px 0 0;font-size:14px}
.changes ul{padding-left:20px;list-style:disc;font-size:14px;line-height:1.7}
.changes li{margin-top:4px}
.sub-bar{max-width:1100px;margin:0 auto 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panes{display:flex;gap:24px;justify-content:center;align-items:flex-start}
.pane{flex:none}
.pane>h3{font-size:14px;font-weight:700;margin:0 0 8px}
.pane>h3 em{font-style:normal;color:var(--muted);font-weight:500;margin-left:8px}
.shot{background:#fff;border:1px solid var(--line);overflow:hidden}
.shot>img{display:block;width:100%;height:auto}

/* ===== 화면(바꾼 뒤 = 기본, 지금 재현 = .now 가 되돌림) ===== */
.stage{container:st/inline-size;--primary:#89CFF0;--p50:#E0F2FE;--tint:#F0F8FF;--tl:#BFE3F7;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g500:#6B7280;--sub:#4B5563;--ink:#1F2937;
  --info:#315E86;--info-soft:#EDF4FA;--warn:#805B16;--warn-soft:#FFF5DB;--succ:#276749;--succ-soft:#EAF5EE;--danger:#B42318;--danger-soft:#FEECE9;--alert50:#FFFBEB;--alert200:#FDE68A;
  --fx-accent:radial-gradient(120% 140% at 100% 0%,rgb(255 255 255/.9) 0%,rgb(255 255 255/0) 45%),radial-gradient(80% 120% at 0% 100%,rgb(137 207 240/.28) 0%,rgb(137 207 240/0) 60%),linear-gradient(135deg,#f0f8ff 0%,#e0f2fe 100%);
  --sh-accent:inset 0 1px 0 rgb(255 255 255/.8),0 8px 24px rgb(137 207 240/.18);
  --fx-card:radial-gradient(90% 120% at 100% 0%,rgb(137 207 240/.07) 0%,rgb(137 207 240/0) 55%),linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
  --sh-card:inset 0 1px 0 #fff,0 1px 2px rgb(31 41 55/.04),0 4px 12px rgb(31 41 55/.04);
  --hair:inset 0 0 0 1px var(--g200);
  --fx-btn:linear-gradient(180deg,#95d4f2 0%,#89cff0 100%);
  background:#fff;position:relative;font-size:16px;line-height:1.6;color:var(--ink)}
.stage a{color:inherit;text-decoration:none}
.stage h1,.stage h2,.stage h3{font-family:Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;font-weight:800;line-height:1.3;color:var(--ink)}
.stage svg{flex:none}
.app{display:flex;min-height:900px}
.sb{flex:none;width:240px;background:var(--tint);border-right:1px solid var(--g200);display:flex;flex-direction:column;padding:0 8px 8px}
.sb-top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 8px}
.sb-top .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.logo img{width:28px;height:28px;border-radius:22%}
.sb nav{flex:1}
.sb nav a{display:flex;align-items:center;gap:12px;height:36px;margin-bottom:2px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500}
.sb nav a[aria-current]{background:var(--p50);font-weight:600}
.sb nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb nav .n{margin-left:auto;display:grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--primary);font-size:14px;font-weight:700;line-height:1}
.sb .me{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;font-size:14px;font-weight:600;border-top:1px solid var(--g200)}
.me i{width:28px;height:28px;border-radius:50%;background:var(--p50)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{display:none;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid var(--g200);background:#fff}
.tb .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.tb button{width:44px;height:44px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pane-main{flex:1;width:100%;padding:40px;min-width:0;container:pane/inline-size}
.col{max-width:880px;margin-inline:auto}
.col.w1040{max-width:1040px}
.ft{background:var(--g50);padding:40px 0;font-size:14px;color:var(--sub)}
.ft .in{max-width:928px;margin:0 auto;padding:0 24px}
.ft .r1,.ft .r2{display:flex;flex-wrap:wrap;gap:0 24px;justify-content:space-between}
.ft a{display:inline-flex;align-items:center;min-height:44px}
.ft .biz{margin-top:8px;line-height:1.7}

/* 페이지 머리 — 지금: 제목 24 / 바꾼 뒤: 제목 32 (휴대폰 24) */
.ph{margin-bottom:32px}
.phrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.ph h1{font-size:32px;line-height:1.3}
.cnt{margin-left:8px;font:400 16px Pretendard;color:var(--g500);letter-spacing:0}
.phd{margin-top:8px;max-width:680px;color:var(--sub);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;min-width:96px;border:0;border-radius:12px;background:var(--fx-btn);color:var(--ink);font:600 16px/1.4 Pretendard,sans-serif;white-space:nowrap;box-shadow:inset 0 1px 0 rgb(255 255 255/.45),0 1px 2px rgb(31 41 55/.06)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--g500)}
.now .btn.line{box-shadow:inset 0 0 0 1px var(--g400)}
.btn.sm{min-height:44px;min-width:0}
.btn.block{width:100%}

/* 상태 뱃지 — 지금: 글자만(400) / 바꾼 뒤: 점 + 글자(700), 팬 홈 .stt 와 같은 모양 (35절) */
.tg{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:4px 12px;border-radius:9999px;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.tg::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.tg.warn{background:var(--warn-soft);color:var(--warn)}
.tg.succ{background:var(--succ-soft);color:var(--succ)}
.tg.danger{background:var(--danger-soft);color:var(--danger)}
.tg.white{background:#fff}
.tg.white.warn{background:var(--warn-soft)}
.tg.nodot::before{display:none}
.now .tg{min-height:0;gap:0;padding:8px 16px;font-weight:600;line-height:1}
.now .tg::before{display:none}
.tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.now .tg.keep-icon{gap:8px}

/* 탭 — 지금: 밑줄 하늘 2px(1.8:1) / 바꾼 뒤: 44 높이, 고른 탭 --primary-50 면 + 밑줄 2px --brand-line */
.tabs{display:flex;gap:8px;margin:0 0 24px;box-shadow:inset 0 -1px 0 var(--g200)}
.tabs span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;color:var(--sub);font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.tabs span[aria-selected=true]{background:var(--p50);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.now .tabs{gap:24px}
.now .tabs span{padding:0;min-height:44px;font-weight:400;color:var(--sub)}
.now .tabs span[aria-selected=true]{background:none;font-weight:700;color:var(--ink);box-shadow:inset 0 -2px 0 var(--primary)}

.btn.line.sm{min-height:44px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.changes code{font-size:13px;background:#F3F4F6;padding:1px 4px;border-radius:4px}


@container st (max-width:767px){
  .sb{display:none}.tb{display:flex}.app{display:block;min-height:0}
  .pane-main{padding:24px 16px 48px}
  .ph h1{font-size:24px}
  .ft{padding:32px 0}.ft .in{padding:0 16px}
  .ft .r1,.ft .r2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.ft .r1 .logo{grid-column:1/-1}
}
/* ===== 4파트 공통 부품 (바꾼 뒤 = 기본, .now 가 지금 값으로 되돌림) ===== */
.stage{--lw:#DCDEE0;--tl:#BFE3F7;--cream:#FBF5EE;--lcream:#E4D8CB;--g300:#D1D5DB}
.sb .gh{margin:12px 0 2px;padding:0 10px;font-size:14px;font-weight:600;color:var(--sub);line-height:28px}
.sb nav a.subi{height:32px;padding-left:40px;margin-bottom:0}
.soon2{margin-left:8px;font-size:12px;color:var(--sub)}
.ph{margin-bottom:48px}.ph h1{font-size:32px}.ph .phd{margin-top:8px;max-width:680px;color:var(--sub);font-weight:400}
.col.w1200{max-width:1200px}.col.w960{max-width:960px}
.btn{box-shadow:none;background:var(--primary);padding:0 24px;min-width:0}
.btn.sm{min-height:44px;padding:0 16px}
.btn.line{background:#fff;box-shadow:inset 0 0 0 1px var(--g500)}
.btn.text{background:none;box-shadow:none;padding:0 14px}
.btn.danger{background:#fff;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.off{background:var(--g100);color:var(--sub);box-shadow:none;cursor:not-allowed}
.btn.soft{background:#fff;box-shadow:inset 0 0 0 1px var(--g500)}
.now .btn.line{box-shadow:inset 0 0 0 1px var(--g200)}
.now .btn.line.fl{box-shadow:inset 0 0 0 1px var(--g400)}
.now .btn.soft{background:var(--g100);box-shadow:none}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 4 + 8 묶음 */
.grp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.grp+.grp{margin-top:48px;padding-top:48px;border-top:1px solid var(--lw)}
.nm{grid-column:span 4;min-width:0;margin:0;font:800 20px/28px Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;padding-top:var(--nmt,0)}
.now .nm{padding-top:0}
.rows{grid-column:span 8;min-width:0}
.item{min-width:0}.item+.item{border-top:1px solid var(--lw)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:64px;margin:0;padding:8px 0}
.txt{display:flex;flex:1 1 160px;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;margin:0;overflow-wrap:anywhere}
.k{font-size:16px;font-weight:600;line-height:1.5}.v{margin:0;font-size:16px;line-height:1.5}
.s{margin:0;color:var(--sub);font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.act{display:flex;flex:none;flex-wrap:wrap;gap:8px}
.panel{padding-bottom:16px}
.fieldrow{display:flex;flex-direction:column;gap:8px;padding:16px 0}
.fld{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--g500);font-size:16px;width:100%;overflow-wrap:anywhere}
.fld.ph0{color:var(--sub)}
.fld.bad{box-shadow:inset 0 0 0 2px var(--danger)}
.fld.ta{align-items:flex-start;padding:12px 16px;min-height:120px}
.fld.sel::after{content:"";margin-left:auto;width:8px;height:8px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.lab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-width:0}
.cnt{color:var(--sub);font-size:14px;white-space:nowrap}
.bad-t{color:var(--danger);font-weight:600}
/* 스위치 */
.swb{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:64px;padding:8px 0}
.trk{position:relative;flex:none;width:52px;height:32px;border:1px solid var(--sub);border-radius:999px;background:var(--g200)}
.trk::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--ink)}
.trk.on{background:var(--primary)}.trk.on::after{transform:translateX(20px)}
.now .trk.old{width:48px;height:28px;border:0;background:var(--g500)}
.now .trk.old::after{top:4px;left:4px;width:20px;height:20px;background:#fff}
.now .trk.old.on{background:var(--primary)}.now .trk.old.on::after{transform:translateX(20px)}
.must{margin:0;padding-top:16px;border-top:1px solid var(--lw)}
.must b{display:block;font-size:14px;font-weight:600;line-height:1.5}
.must span{display:block;margin-top:4px;color:var(--sub);font-size:14px;line-height:1.6}
/* 알림 상자 — 바꾼 뒤: 색만으로 알리지 않게 앞에 원 */
.err,.okm{display:flex;gap:12px;align-items:flex-start;margin:0;padding:16px;border-radius:12px;font-weight:600;overflow-wrap:anywhere;max-width:100%}
.err{background:var(--danger-soft);color:var(--danger)}.okm{background:var(--succ-soft);color:var(--succ)}
.err::before,.okm::before{content:"!";flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:currentColor;font-size:14px;font-weight:800;line-height:1;color:#fff}
.okm::before{content:"✓"}
.err::before{background:var(--danger);color:#fff}.okm::before{background:var(--succ);color:#fff}
.now .err::before,.now .okm::before{display:none}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:24px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.quit{margin-top:48px;padding-top:24px;border-top:1px solid var(--lw)}
.more1{margin:48px 0 0;color:var(--sub);font-size:14px;line-height:1.6}
.more1 a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px}
/* 사진 */
.av{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--p50);box-shadow:inset 0 0 0 1px var(--tl);font:800 24px/1 Tmoney,sans-serif;overflow:hidden}
.now .av{box-shadow:none}
.av img{width:100%;height:100%;object-fit:cover}
.bn{display:grid;place-items:center;width:100%;height:160px;margin-top:4px;border-radius:12px;background:var(--p50);box-shadow:inset 0 0 0 1px var(--tl);color:var(--sub);font-size:14px;overflow:hidden}
.now .bn{box-shadow:none}
.bn img{width:100%;height:100%;object-fit:cover}
/* 상태 뱃지(점 + 글자) */
.bd{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.bd::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.bd.ok{background:var(--succ-soft);color:var(--succ)}.bd.wr{background:var(--warn-soft);color:var(--warn)}.bd.nn{background:var(--g100);color:var(--sub)}
.now .bd{background:var(--p50)!important;color:var(--ink)!important;font-weight:600;padding:4px 16px;gap:0}.now .bd::before{display:none}
/* 판(카드) */
.panelc{min-width:0;border-radius:16px;background:#fff;box-shadow:var(--hair),var(--sh-card)}
.now .panelc{box-shadow:none;border:1px solid var(--lw)}
.pform{min-width:0}
.pform .sub{display:grid;gap:8px;min-width:0;padding:32px;border-bottom:1px solid var(--lw)}
.now .pform .sub{padding:24px}
.pform .sub.last{border-bottom:0}
.pform .end{padding:16px 32px 32px;margin:0}
.now .pform .end{padding:16px 24px 24px}
.pt{margin:0 0 8px;font:800 20px/1.4 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em}
.stt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;font-size:16px;font-weight:600;line-height:1.4}
.hint{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.gi{display:grid;grid-template-columns:minmax(0,1fr) var(--pv,300px);column-gap:24px;align-items:start}
.pv{position:sticky;top:24px;display:grid;align-content:start;gap:12px;min-width:0}
.pv>h3{margin:0;font:600 16px/1.4 Pretendard,sans-serif;letter-spacing:0}
.sec-t{margin:0 0 24px;font:800 20px/1.4 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em}
.jump{display:flex;flex-wrap:wrap;gap:0 16px;margin:-32px 0 32px;font-size:14px}

  <div class="sub"><p class="stt"><span>태그</span></p><div class="chips">${TAGS.map(([t,on])=>`<span class="pk ${on?'on':''}"><i></i>${t}${on?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>':''}</span>`).join('')}</div><p class="k" style="margin-top:16px">태그 직접 입력 (최대 1개)</p>${fld('예: 팝콘TV','ph0'+(er?' bad':''),360)}<p class="hint">활동 플랫폼과 방송 분야를 선택해 주세요.<br>선택·직접 입력 합계: 1~5개 · 현재 2개<br>직접 입력: 최대 20자<br>직접 입력한 태그는 선택한 태그 뒤에 표시됩니다. 욕설·연락처·주소는 입력할 수 없습니다.</p></div>
  <div class="sub last"><div class="swb" style="padding:0"><strong>크리에이터 찾기에 보이기</strong><span class="trk on" role="img" aria-label="켜짐"></span></div></div>
  <div class="end">${er?'<p class="err" role="alert">직접 입력한 태그에는 욕설·연락처·주소를 쓸 수 없습니다.</p>':''}<div class="btns">${B('취소','line')}${er?B('저장 중','off','aria-disabled="true"'):B('저장','')}</div></div></form></div>
  <aside class="pv" aria-labelledby="pe-pv"><h3 id="pe-pv">프로필 머리 미리보기</h3><section class="head"><div class="cv">${nop?'':`<img src="${GIFT}" alt="">`}</div><div class="hb"><span class="av">${nop?'하':`<img src="${GIFT}" alt="">`}</span><div><p class="nn2">하루 <span class="fb">하루별</span></p><p class="s">게임 방송을 해요.</p></div></div></section></aside></div>`,'creator','프로필 수정',{w:'w1200'});
};
/* ---------- 8 /creator/customize ---------- */
const NS=[['정사각',1080,1080],['세로 (스토리용)',1080,1920],['가로',1920,1080]];
const customize=k=>{
  const ready=k==='ready', nosym=k==='nosym';
  const sizes=ready?`<ul class="szs">${NS.map(([t,w,h])=>{const q=46/Math.max(w,h);return `<li><span class="th"><i style="width:${Math.round(w*q)}px;height:${Math.round(h*q)}px"></i></span><span class="szt"><span class="k">${t}</span><span class="s">${w} × ${h}</span></span><span class="btns">${B('다운로드')}${B('링크 복사')}</span></li>`}).join('')}</ul>`
    :`<p class="lock">채널 소유자 확인 후 ‘<a href="#">상세 설정 &gt; 선물 링크</a>’에서 링크 주소를 등록하면 다운로드할 수 있습니다.</p>`;
  return shell(head('내 팬꾹 꾸미기','선물 링크의 공유 이미지와 공지 이미지를 설정합니다.')
  +`<section class="grp"><h2 class="nm">링크 미리보기 이미지</h2><div class="rows" style="padding-top:4px"><p class="s">메신저·SNS에 선물 링크를 공유할 때 표시되는 이미지입니다.</p><div class="picks" role="radiogroup"><span class="po on"><i></i>프로필 사진</span><span class="po ${nosym?'dis':''}"><i></i><span>팬마크${nosym?'<small><a href="#">팬마크 등록</a> 후 선택 가능</small>':''}</span></span></div><div style="min-height:22px;margin-top:8px">${nosym?'<p class="err" role="status">저장하지 못했습니다. 다시 선택해 주세요.</p>':''}</div><div style="margin-top:16px"><p class="cap">링크 공유 미리보기</p><div class="shc"><div class="im"><b><img src="${GIFT}" alt=""></b></div><p>하루 · 팬꾹</p></div></div></div></section>`
  +`<section class="grp"><h2 class="nm">공지 이미지 다운로드</h2><div class="rows" style="padding-top:4px"><p class="s">내 채널에 선물 링크를 알릴 때 사용하는 이미지입니다.<br>배경 사진·프로필 사진·이름·소개·‘팬꾹으로 선물 보내기’ 문구·링크 주소가 포함됩니다.<br>스토리에서는 이미지 속 주소를 누를 수 없으니 링크 스티커를 추가해 주세요.</p>${sizes}</div></section>`,'creator','꾸미기');
};

/* ---------- 탭 ---------- */
const TABS={
me:{label:'계정 설정(팬)',route:'/me',states:{base:{label:'받을 주소 없음',now:'me',render:()=>me('base')},addr:{label:'받을 주소 등록됨(삭제 확인)',render:()=>me('addr')},err:{label:'저장 오류',render:()=>me('err')},saving:{label:'저장 중',render:()=>me('saving')},pend:{label:'저장됨 · 새 이메일 확인 대기',render:()=>me('pend')},gmail:{label:'목록 도메인(gmail.com)',render:()=>me('gmail')}},
 changes:CH.me[0],keep:CH.me[1]},
profile:{label:'프로필 수정(팬)',route:'/me/profile',states:{base:{label:'사진 없음 · 소개 비어 있음',now:'me-profile',render:()=>meProfile('base')},photo:{label:'사진 있음 · 저장됨',render:()=>meProfile('photo')},err:{label:'닉네임 오류',render:()=>meProfile('err')}},changes:CH.profile[0],keep:CH.profile[1]},
following:{label:'팔로우한 크리에이터',route:'/me/following',states:{list:{label:'7명',now:'me-following',render:()=>following('list')},empty:{label:'0명',render:()=>following('empty')}},changes:CH.following[0],keep:CH.following[1]},
email:{label:'이메일 확인',route:'/me/email/confirm',states:{ready:{label:'확인 전',now:'me-email-confirm',render:()=>emailC('ready')},sending:{label:'확인 중',render:()=>emailC('sending')},done:{label:'확인 완료',render:()=>emailC('done')},failed:{label:'실패(만료 등)',render:()=>emailC('failed')},anon:{label:'로그인 안 함',render:()=>emailC('anon')}},changes:CH.email[0],keep:CH.email[1]},
account:{label:'계정 설정(크리에이터)',route:'/creator/account',states:{ver:{label:'채널 확인됨',now:'creator-account',render:()=>crAccount('ver')},err:{label:'확인 전 · 번호 없음 · 저장 오류',render:()=>crAccount('err')},saved:{label:'확인 전 · 알림 저장됨',render:()=>crAccount('saved')}},changes:CH.account[0],keep:CH.account[1]},
settings:{label:'상세 설정',route:'/creator/settings',states:{closed:{label:'접힘(전부)',now:'creator-settings',render:()=>settings('closed')},addr:{label:'받는 주소 펼침',render:()=>settings('addr')},recv:{label:'받기 설정 펼침',render:()=>settings('recv')},blocked:{label:'차단한 팬 있음',render:()=>settings('blocked')},blockedNone:{label:'차단한 팬 없음',render:()=>settings('blockedNone')},link:{label:'선물 링크 펼침',render:()=>settings('link')},reply:{label:'감사 답장 펼침',render:()=>settings('reply')},fresh:{label:'승인 서명 연결 전 · 팬마크 없음 · 저장 오류',render:()=>settings('fresh')},B:{label:'비교안 B(전체 880 한 기둥)',render:()=>settings('B')}},changes:CH.settings[0],keep:CH.settings[1]},
cprofile:{label:'프로필 수정(크리에이터)',route:'/creator/profile',states:{base:{label:'사진 있음',now:'creator-profile',render:()=>crProfile('base')},empty:{label:'사진 없음',render:()=>crProfile('empty')},err:{label:'태그 오류 · 저장 중',render:()=>crProfile('err')}},changes:CH.cprofile[0],keep:CH.cprofile[1]},
customize:{label:'꾸미기',route:'/creator/customize',states:{base:{label:'공지 이미지 받기 전(안내)',now:'creator-customize',render:()=>customize('base')},ready:{label:'공지 이미지 세 크기',render:()=>customize('ready')},nosym:{label:'팬마크 없음 · 저장 오류',render:()=>customize('nosym')}},changes:CH.customize[0],keep:CH.customize[1]}
};

const NOWDIR='now/';
let cur='me',sub={},W=1440,V='both';
Object.keys(TABS).forEach(k=>sub[k]=Object.keys(TABS[k].states)[0]);
const $=s=>document.querySelector(s);
const tabs=$('#tabs');
Object.entries(TABS).forEach(([k,s])=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.k=k;b.setAttribute('role','tab');tabs.append(b)});
function draw(){
  const t=TABS[cur], st=t.states[sub[cur]];
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
  document.querySelectorAll('#widths button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===W));
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===V));
  const md=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  $('#changes').innerHTML=`<h2>${t.label}<span>${t.route}</span></h2><h4>바뀌는 것</h4><ul>${t.changes.map(x=>`<li>${md(x)}</li>`).join('')}</ul><h4>바뀌지 않는 것</h4><ul>${t.keep.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
  $('#sub').innerHTML='<span class="seg-label">상태</span><div class="seg" id="subs">'+Object.entries(t.states).map(([k,v])=>`<button data-s="${k}" aria-pressed="${k===sub[cur]}">${v.label}</button>`).join('')+'</div>';
  const n=V==='both'?2:1, avail=document.documentElement.clientWidth-48-24*(n-1);
  const z=Math.min(1,avail/(W*n));
  const nowBody=st.now?`<img src="${NOWDIR}${st.now}-${W}.jpg" alt="지금 화면 ${W}">`:`<div style="zoom:${z}"><div class="stage now" style="width:${W}px">${st.render()}</div></div>`;
  const nowHtml=`<div class="pane"><h3>지금<em>${st.now?'캡처':'코드 값으로 다시 그림(캡처 없음 · 재현)'} · ${W}</em></h3><div class="shot" style="width:${W*z}px">${nowBody}</div></div>`;
  const aft=`<div class="pane"><h3>바꾼 뒤<em>${W}</em></h3><div class="shot" style="width:${W*z}px"><div style="zoom:${z}"><div class="stage" style="width:${W}px" id="stage">${st.render()}</div></div></div></div>`;
  $('#panes').innerHTML=(V==='both'?nowHtml:'')+aft;
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;draw()}};
$('#widths').onclick=e=>{const b=e.target.closest('button');if(b){W=+b.dataset.w;draw()}};
$('#views').onclick=e=>{const b=e.target.closest('button');if(b){V=b.dataset.v;draw()}};
$('#sub').onclick=e=>{const b=e.target.closest('button');if(b){sub[cur]=b.dataset.s;draw()}};
addEventListener('resize',draw);
const q=new URLSearchParams(location.search);
if(q.get('s')&&TABS[q.get('s')])cur=q.get('s');if(q.get('st')&&TABS[cur].states[q.get('st')])sub[cur]=q.get('st');if(q.get('w'))W=+q.get('w');if(q.get('v'))V=q.get('v');
draw();
</script></body></html>
