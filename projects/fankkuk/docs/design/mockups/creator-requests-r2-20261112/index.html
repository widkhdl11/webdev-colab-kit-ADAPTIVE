<title>크리에이터 승인 내역 (/creator/requests) — 배치 시안 2판 (2026-11-12)</title>
<!--
시안 2판: 관리형 — 크리에이터 승인 내역(/creator/requests). 정적. JS 는 상태 바꾸기·목록 그리기 전용(저장·서버 없음).
2판 지시: design-prompt·design-rules·tokens 개정(폭은 tokens.md 3절 토큰, 2-23)을 처음부터 다시 읽고 새로 판단해 그림. 1판(creator-requests-20261112)은 비교용으로만 봄 — 복사하지 않음.
지시 원문 요약: 「결과별 건수를 눌러 거르는 칩으로 바꾸는 것은 새 동작이라 하지 않는다」· 「폭은 본문 틀 네 가지 중 목적에 맞는 토큰, 숫자로 적지 않는다」.
근거: docs/design/design-prompt.md · tokens.md · design-rules.md(본문 틀·23-3·40절) · docs/ux/pages/creator-requests.md(승인 취소 상태표)
값: ../../../../src/shared/ui/tokens.css 와 레포 글꼴을 상대 경로로 그대로 불러온다(14-6). 색·글자·간격·반경은 tokens.css 변수만. 새로 지은 색 없음.
shell.css = 로그인 후 사이드바·위 막대(실제 사이트 머리 CSS) 복사본 — 본문 배치와 무관.
문구는 지금 화면(decided-request-list.tsx · approval-cancel-button.tsx)의 문구 그대로. 새 안내 문장 없음. 이름·주문번호·날짜는 모두 가짜 값.
상태: #list · #confirm-before · #confirm-expired · #confirm-after · #cancel-error · #done-before · #done-after · #empty (오른쪽 아래·휴대폰은 위 막대 옆 「시안 상태」 단추)
-->
<link rel="stylesheet" href="../../../../src/shared/ui/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="shell.css">
<style>
@font-face { font-family: "Tmoney Round Wind"; src: url("../../../../public/fonts/TmoneyRoundWindRegular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Tmoney Round Wind"; src: url("../../../../public/fonts/TmoneyRoundWindExtraBold.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Pretendard"; src: url("../../../../assets/fonts/Pretendard-Medium.subset.woff") format("woff"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Pretendard"; src: url("../../../../assets/fonts/Pretendard-SemiBold.subset.woff") format("woff"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Pretendard"; src: url("../../../../assets/fonts/Pretendard-Bold.subset.woff") format("woff"); font-weight: 700; font-display: swap; }

:root {
  /* (가정) 오른쪽 요약 칸 폭. tokens.md 에 없다 — 지금 구현(decided-request-list.module.css .top)이 288 을 쓰고 있고 design-rules 본문 틀 「두 단」이 280~288 이라 그 값을 그대로. 토큰 추가 제안: --aside-w */
  --aside-w: 288px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--ink); font-family: var(--font); font-size: var(--fs-body); line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3, p, ul, dl, dd, dt { margin: 0; }
ul { padding: 0; list-style: none; }
h1, h2, h3 { font-family: var(--font-round); font-weight: var(--fw-title); letter-spacing: var(--ls-title); font-synthesis: none; text-wrap: balance; }
button { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- 본문 틀: 표·목록 + 오른쪽 요약 칸 = 「넓게」 --col-wide. 사이드바 뺀 영역 가운데, 안쪽 여백 40(휴대폰 16) ---------- */
.page { width: 100%; min-width: 0; padding: var(--space-10) var(--space-10) var(--space-16); }
.col { width: 100%; max-width: var(--col-wide); margin-inline: auto; min-width: 0; container: col / inline-size; }
.page-head { margin-bottom: var(--space-8); }
.ph-title { font-size: var(--fs-page); line-height: 1.3; }
.ph-count { margin-left: var(--space-2); font-family: var(--font); font-size: var(--fs-body); font-weight: 400; letter-spacing: 0; color: var(--sub); }

/* 한 단(좁은 본문): 요약이 위, 목록이 아래. 두 단(본문 1020 이상): 목록 왼쪽 + 요약 오른쪽 칸(--aside-w), 요약은 스크롤을 따라온다 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.main { min-width: 0; container: main / inline-size; }
@container col (min-width: 1020px) {
  .layout { grid-template-columns: minmax(0, 1fr) var(--aside-w); gap: var(--space-8); }
  .main { grid-column: 1; grid-row: 1; }
  .rail { grid-column: 2; grid-row: 1; position: sticky; top: var(--space-6); }
}

/* ---------- 상태 태그(base.css .tag--dot 와 같은 값) ---------- */
.tag { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 28px; padding: var(--space-1) var(--space-3); border-radius: var(--r-pill); background: var(--gray-100); color: var(--ink); font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1.4; white-space: nowrap; }
.tag::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: var(--r-pill); background: currentColor; }
.tag--success { background: var(--success-soft); color: var(--success); }
.tag--warn { background: var(--warn-soft); color: var(--warn-ink); }
.tag--danger { background: var(--danger-soft); color: var(--danger); }

/* ---------- 요약 칸(결과별 건수 — 눌리지 않는 표시, 테두리·그림자 없이 선 하나로 나눔 4-6) ---------- */
.rail h2 { padding-bottom: var(--space-2); font-family: var(--font); font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1.5; letter-spacing: 0; color: var(--sub); }
.outs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-6); border-top: 1px solid var(--gray-200); }
.out { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 56px; border-bottom: 1px solid var(--gray-200); }
.out dd { font-family: var(--font-round); font-size: var(--fs-card); font-weight: var(--fw-title); line-height: 1.2; font-variant-numeric: tabular-nums; text-align: right; } /* 2-18 숫자 오른쪽 */
.latest { margin-top: var(--space-3); font-size: var(--fs-small); color: var(--sub); }
@container col (min-width: 560px) and (max-width: 1019px) { .outs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container col (min-width: 1020px) { .outs { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 달마다 묶은 줄 목록 ---------- */
.month + .month { margin-top: var(--space-12); }
.mhead { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
.mhead h3 { font-size: var(--fs-card); line-height: 1.4; letter-spacing: var(--ls-title); }
.mhead small { font-size: var(--fs-small); color: var(--sub); }
.rows { border-top: 1px solid var(--gray-200); }
/* 한 줄 = 얼굴 | 이름 + 아래 한 줄 메타 | 결과 | 처리일 | 승인 취소 칸. 칸 폭을 줄마다 같게(2-6) */
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 104px 88px 108px; column-gap: var(--space-4); align-items: center; min-height: 72px; padding: var(--space-3) 0; border-bottom: 1px solid var(--gray-200); }
.face { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--f, var(--face-default)); box-shadow: var(--face-ring); color: var(--ink); font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1; }
.txt { min-width: 0; }
.name { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--fw-bold); line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; margin-top: var(--space-1); font-size: var(--fs-small); line-height: 1.5; color: var(--sub); }
.meta > span + span::before { content: "·"; margin: 0 var(--space-2); }
.row > time { font-size: var(--fs-small); color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }
.row > .tag { justify-self: start; }
.slot { display: flex; justify-content: flex-end; }
.cancel { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--r-btn); background: none; color: var(--gray-500); font-size: var(--fs-small); font-weight: var(--fw-sub); line-height: 1; cursor: pointer; transition: color var(--dur-hover) var(--ease-out); }
.cancel:is(:hover, :active, :focus-visible) { color: var(--ink); }
.cancel svg { display: block; flex: none; width: 14px; height: 14px; }
.empty { padding: var(--space-12) var(--space-6); border-radius: var(--r-card); background: var(--surface); text-align: center; color: var(--sub); } /* 2-17: 메시지 하나·한 줄 */

/* 줄 폭이 600 미만(휴대폰): 이름 줄 오른쪽에 결과, 아래 메타, 맨 아래 처리일(왼쪽) + 승인 취소(오른쪽 끝, 2-21 11) */
@container main (max-width: 599px) {
  .row { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "face name tag" ". meta meta" ". date slot"; column-gap: var(--space-3); row-gap: 0; align-items: center; min-height: 0; padding: var(--space-3) 0 var(--space-2); }
  .txt { display: contents; }
  .face { grid-area: face; align-self: start; }
  .name { grid-area: name; }
  .meta { grid-area: meta; margin-top: 0; }
  .row > .tag { grid-area: tag; justify-self: end; }
  .row > time { grid-area: date; align-self: center; text-align: left; }
  .slot { grid-area: slot; margin-right: calc(var(--space-2) * -1); } /* 2-8: 글자 오른쪽 끝이 위 태그 오른쪽 끝과 같은 선 */
  .slot:empty { display: none; }
  .row:has(.slot:empty) { padding-bottom: var(--space-3); }
  .row > time { padding-block: var(--space-1); }
}

/* ---------- 결과 설명: 맨 아래 접기(지금과 같음) ---------- */
.folds { margin-top: var(--space-12); max-width: var(--prose-max); }
.fold { border-bottom: 1px solid var(--gray-200); }
.fold:first-child { border-top: 1px solid var(--gray-200); }
.fold summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 44px; font-size: var(--fs-small); font-weight: var(--fw-btn); cursor: pointer; list-style: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "+"; flex: none; font-size: var(--fs-card); color: var(--sub); transition: transform 0.25s var(--ease-micro); }
.fold[open] > summary::after { transform: rotate(45deg); }
.fold p { padding-bottom: var(--space-4); font-size: var(--fs-small); color: var(--sub); }
.fold a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 승인 취소 확인 창(지금 BottomSheet 와 같은 모양: 480 중앙 창 / 767 이하 아래 시트) ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: var(--space-4); background: var(--scrim); }
.scrim[hidden] { display: none; }
.sheet { width: 100%; max-width: 480px; padding: var(--space-6); border-radius: var(--r-panel); background: var(--white); box-shadow: var(--float); }
.grip { display: none; }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
.sh-title { font-family: var(--font); font-size: var(--fs-card); line-height: 1.4; font-weight: var(--fw-bold); letter-spacing: 0; }
.sh-x { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 0; border-radius: var(--r-pill); background: none; cursor: pointer; }
.sh-x:hover { background: var(--gray-50); }
.sh-x svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.stack { display: grid; gap: var(--space-4); }
.dwho { display: flex; align-items: center; gap: var(--space-4); }
.dwho .av { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--gray-100); font-weight: var(--fw-btn); }
.dwho b { font-weight: var(--fw-btn); }
.kvs { display: grid; gap: var(--space-1); padding: var(--space-4); border-radius: var(--r-card); background: var(--gray-50); }
.kv { display: flex; justify-content: space-between; gap: var(--space-4); }
.kv dt { color: var(--gray-600); }
.kv dd { text-align: right; font-weight: var(--fw-btn); }
.sent { font-weight: var(--fw-btn); }
.err { display: flex; align-items: flex-start; gap: var(--space-2); font-weight: var(--fw-bold); }
.err i { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); font-style: normal; line-height: 1; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); } /* 2-21(6): 반씩, primary 오른쪽 */
.btns.one { grid-template-columns: 1fr; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--btn-h); padding: 0 var(--space-6); border: 0; border-radius: var(--r-btn); background: var(--brand); color: var(--on-brand); font-size: var(--fs-body); font-weight: var(--fw-btn); line-height: 1.25; cursor: pointer; }
.btn:hover { background: var(--brand-hover); }
.btn--line { background: var(--white); box-shadow: var(--hair); }
.btn--line:hover { background: var(--surface-hover); }

@media (max-width: 767px) {
  .scrim { place-items: end center; padding: 0; }
  .sheet { max-width: 560px; padding: var(--space-3) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom)); border-radius: var(--r-panel) var(--r-panel) 0 0; }
  .grip { display: block; width: 40px; height: 4px; margin: 0 auto var(--space-3); border-radius: var(--r-pill); background: var(--grip); }
}
@media (max-width: 768px) {
  .page { padding: var(--space-6) var(--space-4) var(--space-12); }
  .page-head { margin-bottom: var(--space-6); }
  .month + .month { margin-top: var(--space-8); }
}

/* ---------- 시안 전용 상태 단추(실제 화면 아님) ---------- */
.mock { position: fixed; right: 12px; bottom: 12px; z-index: 90; max-width: calc(100vw - 24px); border-radius: var(--r-btn); background: var(--gray-900); color: var(--white); font-size: var(--fs-small); box-shadow: var(--float); }
.mock summary { display: flex; align-items: center; min-height: 44px; padding: 0 var(--space-4); font-weight: var(--fw-bold); cursor: pointer; }
.mock .mb { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: 0 var(--space-3) var(--space-3); max-width: 420px; }
.mock button { min-height: 44px; padding: 0 var(--space-3); border: 1px solid var(--gray-300); border-radius: var(--r-btn); background: transparent; color: var(--white); font-size: var(--fs-small); cursor: pointer; }
.mock button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-brand); font-weight: var(--fw-bold); }
@media (max-width: 768px) { .mock { top: 6px; right: 56px; bottom: auto; max-width: calc(100vw - 72px); } .mock .mb { max-height: 70vh; overflow-y: auto; } }

/* 2026-11-12 기본 프로필 사진 = 고양이 얼굴(public/img/default-face/cat.webp) — 사용자 지시 */
.face, .sb-avatar, .oface, .dwho .av, .sb .me i { overflow: hidden; }
.pf { display: block; width: 100%; height: 100%; object-fit: cover; }
.pfb { border-radius: 50%; overflow: hidden; }
</style>
</head>

2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"></path><path d="m7.5 4.27 9 5.15"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><line x1="12" x2="12" y1="22" y2="12"></line></svg><span class="sb-label">팬에게 보내기</span></a></li><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"></path><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"></path><rect x="3" y="7" width="18" height="4" rx="1"></rect></svg><span class="sb-label">다른 크리에이터에게 선물</span></a></li><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path></svg><span class="sb-label">팔로우한 크리에이터</span></a></li><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg><span class="sb-label">보낸 내역</span></a></li></ul></div><div><p class="sb-group" id="sb-g3"><span class="sb-group-t">내 팬꾹</span></p><ul aria-labelledby="sb-g3"><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle></svg><span class="sb-label">꾸미기</span></a></li><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><span class="sb-label">프로필 수정</span></a></li><li><a href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg><span class="sb-label">상세 설정</span></a></li></ul></div></nav><div class="sb-bottom"><details class="sb-menu"><summary aria-label="하루님 계정 메뉴"><span class="sb-avatar" aria-hidden="true"><img class="pf" src="../../../../public/img/default-face/cat.webp" alt="" aria-hidden="true"></span><span class="sb-name">하루<!-- -->님</span><svg class="ico sb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg></summary><div class="sb-menu-list"><a href="#">계정 설정</a><button class="menu-action" type="button" aria-disabled="false">로그아웃</button></div></details></div></aside>
<main id="main" class="page"><div class="col">
  <header class="page-head"><h1 class="ph-title">승인 내역<span class="ph-count" id="h1n"></span></h1></header>

  <div class="layout">
    <section class="rail" id="done" aria-labelledby="done-h">
      <h2 id="done-h">처리한 요청</h2>
      <dl class="outs" aria-label="결과별 건수" id="outs"></dl>
      <p class="latest" id="latest"></p>
    </section>
    <div class="main">
      <div id="listwrap"></div>
      <div class="folds" id="folds"></div>
    </div>
  </div>
</div></main>

<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t" id="sheet"></div></div>

<details class="mock" id="mock"><summary>시안 상태</summary><div class="mb" id="mb"></div></details>

<script>
/* 시안 전용: 가짜 데이터로 목록을 그리고 상태를 바꾼다. 실제 동작·저장 없음. */
var TAG = { approved: ["승인", "success"], declined: ["거절", "danger"], blocked: ["차단", "danger"], expired: ["기한 만료", "warn"] };
var ORDER = ["approved", "declined", "expired", "blocked"];
var ROWS = [
  { no: "FC-7K3M9", fan: "별빛", kind: "앨범·포토카드", box: 2, o: "approved", m: 11, d: 10, can: true },
  { no: "FC-4D8QW", fan: "도담", kind: "편지", box: 1, o: "approved", m: 11, d: 9, can: true },
  { no: "FC-9T2LB", fan: "하늬", kind: "의류", box: 3, o: "declined", m: 11, d: 8 },
  { no: "FC-2X6NA", fan: "보라", kind: "간식", box: 1, o: "approved", m: 11, d: 6, can: false },
  { no: "FC-8H5PC", fan: "새벽", kind: "앨범·포토카드", box: 2, o: "blocked", m: 11, d: 4 },
  { no: "FC-3J7RD", fan: "마루", kind: "편지", box: 1, o: "approved", m: 10, d: 29, can: false },
  { no: "FC-6V1KE", fan: "나비", kind: "의류", box: 2, o: "expired", m: 10, d: 27 },
  { no: "FC-5B9ZF", fan: "구름", kind: "간식", box: 4, o: "approved", m: 10, d: 21, can: false },
  { no: "FC-1M4TG", fan: "솔잎", kind: "앨범·포토카드", box: 1, o: "declined", m: 10, d: 15 }
];
var STATES = [["list", "목록"], ["confirm-before", "창 · 입고 전"], ["confirm-expired", "창 · 기한 지남"], ["confirm-after", "창 · 입고 뒤"], ["cancel-error", "창 · 오류"], ["done-before", "취소 뒤 · 입고 전"], ["done-after", "취소 뒤 · 입고 뒤"], ["empty", "처리한 요청 없음"]];
var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
var $ = function (id) { return document.getElementById(id); };

function render(st) {
  var rows = ROWS.map(function (r) { return Object.assign({}, r); });
  if (st === "done-before") rows = rows.filter(function (r) { return r.no !== "FC-7K3M9"; });
  if (st === "done-after") { rows[0].o = "declined"; rows[0].can = false; }
  if (st === "empty") rows = [];
  var cnt = {}; ORDER.forEach(function (o) { cnt[o] = rows.filter(function (r) { return r.o === o; }).length; });
  $("h1n").textContent = rows.length + "건";
  var last = rows.reduce(function (a, r) { var k = r.m * 100 + r.d; return k > a ? k : a; }, 0);
  $("latest").textContent = last ? "최근 처리일 2026.11." + String(last % 100).padStart(2, "0") : "";
  $("outs").innerHTML = ORDER.map(function (o) {
    return '<div class="out"><dt><span class="tag tag--' + TAG[o][1] + '">' + TAG[o][0] + '</span></dt><dd>' + cnt[o] + '</dd></div>';
  }).join("");
  var months = [];
  rows.forEach(function (r) { var m = months[months.length - 1]; if (m && m.m === r.m) m.rows.push(r); else months.push({ m: r.m, rows: [r] }); });
  var html = "";
  if (!rows.length) html = '<p class="empty">처리한 요청이 없습니다.</p>';
  else html = months.map(function (mo) {
    return '<section class="month" aria-labelledby="mh' + mo.m + '"><div class="mhead"><h3 id="mh' + mo.m + '">' + mo.m + '월</h3><small>' + mo.rows.length + '건</small></div><ul class="rows">' + mo.rows.map(function (r) {
      var idx = ROWS.findIndex(function (x) { return x.no === r.no; });
      return '<li class="row"><span class="face" aria-hidden="true"><img class="pf" src="../../../../public/img/default-face/cat.webp" alt="" aria-hidden="true"></span>' +
        '<p class="txt"><strong class="name">' + r.fan + '님의 선물</strong><span class="meta"><span>' + r.kind + '</span><span>상자 ' + r.box + '개</span><span>' + r.no + '</span></span></p>' +
        '<span class="tag tag--' + TAG[r.o][1] + '">' + TAG[r.o][0] + '</span><time datetime="2026-' + r.m + '-' + r.d + '">' + r.m + '월 ' + r.d + '일</time>' +
        '<span class="slot">' + (r.can ? '<button class="cancel" type="button" data-open aria-label="' + r.fan + '님 선물 승인 취소">' + ICON + '승인 취소</button>' : '') + '</span></li>';
    }).join("") + '</ul></section>';
  }).join("");
  $("listwrap").innerHTML = html;
  var f = "";
  if (cnt.expired) f += '<details class="fold"><summary>승인 기한 만료</summary><p>7일 이내에 승인 여부를 선택하지 않아 자동으로 거절 처리되었습니다.</p></details>';
  if (cnt.blocked) f += '<details class="fold"><summary>팬 차단</summary><p>차단한 팬은 새 선물을 등록할 수 없습니다. 차단 해제는 <a href="#">상세 설정 &gt; 주소와 설정 &gt; 차단한 팬</a>에서 할 수 있습니다.</p></details>';
  $("folds").innerHTML = f;
}

function dialog(st) {
  var s = $("sheet"), scrim = $("scrim");
  var open = /^(confirm-|cancel-error)/.test(st);
  scrim.hidden = !open;
  if (!open) { s.innerHTML = ""; return; }
  var sentence = { "confirm-before": "승인 대기로 돌아갑니다. 11월 17일까지 다시 승인할 수 있습니다.", "confirm-expired": "승인 기한이 지나 다시 승인할 수 없습니다. 취소하면 기한 만료로 반려됩니다.", "confirm-after": "팬꾹에 도착한 상자가 있어 취소하면 거절로 끝나고 상자는 팬에게 반송됩니다. 다시 승인할 수 없습니다." }[st];
  var next = st === "confirm-after" ? "done-after" : "done-before";
  var tail = st === "cancel-error"
    ? '<p class="err" role="alert"><i aria-hidden="true">!</i>송장이 이미 출력돼 승인을 취소할 수 없습니다. 1:1 문의로 알려 주세요.</p><div class="btns one"><button class="btn btn--line" type="button" data-close>닫기</button></div>'
    : '<p class="sent">' + sentence + '</p><div class="btns"><button class="btn btn--line" type="button" data-close>닫기</button><button class="btn" type="button" data-go="' + next + '">승인 취소</button></div>';
  s.innerHTML = '<span class="grip" aria-hidden="true"></span><div class="sh-head"><h2 class="sh-title" id="dlg-t">승인을 취소할까요?</h2><button class="sh-x" type="button" aria-label="닫기" data-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>' +
    '<div class="stack"><div class="dwho"><span class="av" aria-hidden="true"><img class="pf" src="../../../../public/img/default-face/cat.webp" alt="" aria-hidden="true"></span><b>별빛님</b></div><dl class="kvs"><div class="kv"><dt>선물 종류</dt><dd>앨범·포토카드</dd></div><div class="kv"><dt>상자</dt><dd>2개</dd></div><div class="kv"><dt>주문번호</dt><dd>FC-7K3M9</dd></div></dl>' + tail + '</div>';
}

function setState(st) {
  document.body.dataset.state = st;
  render(/^(confirm-|cancel-error)/.test(st) ? "list" : st);
  dialog(st);
  Array.prototype.forEach.call($("mb").children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.s === st)); });
}
$("mb").innerHTML = STATES.map(function (s) { return '<button type="button" data-s="' + s[0] + '" aria-pressed="false">' + s[1] + '</button>'; }).join("");
$("mb").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) location.hash = b.dataset.s; });
document.addEventListener("click", function (e) {
  var go = e.target.closest("[data-go]");
  if (e.target.closest("[data-open]")) location.hash = "confirm-before";
  else if (go) location.hash = go.dataset.go;
  else if (e.target.closest("[data-close]")) location.hash = "list";
  if (e.target.closest(".topbar .icon-btn")) document.documentElement.dataset.open = "1";
  else if (e.target.closest(".sb-close") || e.target.closest(".sb-scrim")) delete document.documentElement.dataset.open;
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) location.hash = "list"; });
window.addEventListener("hashchange", function () { setState(location.hash.slice(1) || "list"); });
setState(location.hash.slice(1) || "list");
</script>
</body>
</html>
