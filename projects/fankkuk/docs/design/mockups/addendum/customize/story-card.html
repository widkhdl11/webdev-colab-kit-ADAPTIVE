<!doctype html>
<!--
  팬꾹 시안 addendum — 스토리 홍보 카드 세로 1080x1920 (2026-10-14 정정판)
  사용자 정정: 스토리 카드는 답장 공유용이 아니다. 크리에이터가 자기 인스타·유튜브 스토리에 올려 「팬꾹으로 선물 보내 주세요」라고 알리는 홍보 카드다. 답장(감사) 내용 없음.
  기존 지난판(답장 공유 세로 카드, X용/스토리용 고르기 줄)은 버림.
  근거: 구현된 정사각 공지 이미지(src/widgets/link-images/ui/link-image-cards.tsx NoticeImageCard 1080x1080)를 세로로 옮김.
    같은 구성: 프로필 사진(원형 360, 흰 테두리 14) -> 「선물은 팬꾹으로 받아요」 72/800 -> 흰 알약 「승인한 선물만 받습니다」(높이 84, 반경 20, 40/800, #A4433D) -> 링크 주소. 로고 없음.
    같은 색: 바탕 #FCECE8, 글자 #343039, 강조 #A4433D, 사진 없을 때 원 #F7C8D4.
  달라진 것: 세로로 늘어난 만큼 위 250 · 아래 250(스토리 앱이 가리는 곳)을 비우고 그 안쪽(250~1670, 가운데 960)에 가운데 정렬. 링크 주소는 스토리에서 누를 수 없어 48 -> 72 로 키움.
  확인 필요: 구현된 정사각 공지 이미지에는 공개 이름이 없다(사진·문구·링크만). 이 시안도 이름을 넣지 않았다. 이름을 넣으려면 정사각도 같이 바뀐다.
  「링크 스티커를 붙여 주세요」 안내는 이미지가 아니라 이 화면의 안내문이다(이미지에는 안 들어감).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬꾹 — 스토리 홍보 카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumSquareRound/NanumSquareRound.css">
<link rel="stylesheet" href="../../site/v18/tokens.css">
<link rel="stylesheet" href="../../site/v18/v18.css">
<link rel="stylesheet" href="../../site/v18/v18-app.css">
<link rel="stylesheet" href="../../site/v18/v18-cre.css">
<script src="../../site/v18/font-switch.js" defer></script>
<style>
.wrap { max-width: var(--container-max); margin: 0 auto; padding: var(--sp-48) var(--container-pad) var(--sp-96); display: grid; gap: var(--sp-32); }
.tip { max-width: 560px; display: grid; gap: var(--sp-8); }
.tip h2 { margin: 0; font-size: var(--fs-h3); font-weight: var(--fw-h3); }
.tip ol { margin: 0; padding-left: 20px; color: var(--gray-600); }
.guide { display: flex; gap: var(--sp-8); align-items: center; }
.guide input { width: 20px; height: 20px; accent-color: var(--primary); }
.guide input:focus-visible, .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.stage { display: flex; flex-wrap: wrap; gap: var(--sp-32); align-items: flex-start; }
.stage figure { margin: 0; }
.stage figcaption { margin-top: var(--sp-8); color: var(--gray-600); max-width: 324px; }
.stage figcaption b { color: var(--gray-900); }
.fit { --s: .3; width: calc(1080px * var(--s)); height: calc(1920px * var(--s)); overflow: hidden; border-radius: 12px; border: var(--bw) solid var(--gray-200); box-shadow: var(--shadow); }
.fit > .art { width: 1080px; height: 1920px; transform: scale(var(--s)); transform-origin: 0 0; position: relative; overflow: hidden; }
@media (max-width: 767px) { .fit { --s: .26; } }
.art, .art * { font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif; }
p { margin: 0; }
/* 카드 안쪽 — link-image-cards.tsx 와 같은 값 */
.nc { width: 1080px; height: 1920px; background: #FCECE8; color: #343039; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.nc-photo { width: 360px; height: 360px; border-radius: 50%; background: #F7C8D4; box-shadow: 0 0 0 14px #fff; display: flex; align-items: center; justify-content: center; font-size: 151px; font-weight: 800; overflow: hidden; }
.nc-photo svg { width: 100%; height: 100%; display: block; }
.nc-h { margin-top: 72px; font-size: 72px; font-weight: 800; letter-spacing: -2px; }
.nc-pill { margin-top: 32px; height: 84px; padding: 0 36px; border-radius: 20px; background: #fff; color: #A4433D; font-size: 40px; font-weight: 800; display: flex; align-items: center; }
.nc-link { margin-top: 72px; font-size: 72px; font-weight: 800; letter-spacing: -1px; }
.safe { position: absolute; left: 0; right: 0; height: 250px; background: rgb(17 24 39 / 55%); z-index: 2; display: none; place-items: center; color: #fff; font-size: 40px; font-weight: 700; }
.safe--t { top: 0; } .safe--b { bottom: 0; }
.show-safe .safe { display: grid; }
</style>
</head>
<body>
<main class="wrap" id="main">
  <header class="page-head" style="margin:0">
    <h1 class="ph-title">스토리 홍보 카드 (세로 1080×1920)</h1>
    <p class="ph-desc">「내 팬꾹 꾸미기」의 공지 이미지 중 세로 판이에요. 내 인스타·유튜브 스토리에 올려 팬꾹으로 선물을 보내 달라고 알려요.</p>
  </header>

  <section class="card tip" aria-labelledby="tip-h">
    <h2 id="tip-h">스토리에 올리는 법</h2>
    <ol><li>이미지를 받아 스토리에 올려요.</li><li>스토리에서는 이미지 속 주소를 누를 수 없어요. 「링크 스티커」를 붙이고 내 링크 주소를 넣어 주세요.</li><li>위·아래는 스토리 앱의 버튼에 가려질 수 있어서 비워 두었어요.</li></ol>
  </section>

  <section aria-labelledby="pv-h">
    <div class="ph-row" style="margin-bottom:var(--sp-16)"><h2 id="pv-h" class="card-t">만들어지는 이미지</h2>
      <label class="guide"><input type="checkbox" id="chk-safe"><span>스토리 앱 가림 영역 보기 <small class="meta">(시안 전용)</small></span></label></div>
    <div class="stage" id="stage">
      <figure><div class="fit" role="img" aria-label="스토리 홍보 카드, 프로필 사진 있는 판"><div class="art" aria-hidden="true"><div class="nc">
        <div class="safe safe--t">위 250px — 스토리 앱이 가려요</div><div class="safe safe--b">아래 250px — 스토리 앱이 가려요</div>
        <div class="nc-photo"><svg viewBox="0 0 88 88"><rect width="88" height="88" fill="#F3D9D5"/><circle cx="44" cy="36" r="16" fill="#8F3836"/><path d="M12 88c2-22 16-30 32-30s30 8 32 30z" fill="#B94A48"/></svg></div>
        <p class="nc-h">선물은 팬꾹으로 받아요</p><p class="nc-pill">승인한 선물만 받습니다</p><p class="nc-link">fankkuk.kr/dawnmoon</p>
      </div></div></div><figcaption><b>사진 있는 판</b> · 사진은 샘플 그림이에요</figcaption></figure>
      <figure><div class="fit" role="img" aria-label="스토리 홍보 카드, 사진 없는 판"><div class="art" aria-hidden="true"><div class="nc">
        <div class="safe safe--t">위 250px — 스토리 앱이 가려요</div><div class="safe safe--b">아래 250px — 스토리 앱이 가려요</div>
        <div class="nc-photo">새</div>
        <p class="nc-h">선물은 팬꾹으로 받아요</p><p class="nc-pill">승인한 선물만 받습니다</p><p class="nc-link">fankkuk.kr/dawnmoon</p>
      </div></div></div><figcaption><b>사진 없는 판</b> · 이름 첫 글자가 대신 들어가요</figcaption></figure>
    </div>
    <p class="meta" style="margin-top:var(--sp-16)">이미지에는 프로필 사진, 고정 문구, 링크 주소만 들어가요. 로고와 답장 글은 없어요.</p>
  </section>
</main>
<script>document.getElementById('chk-safe').addEventListener('change', function () { document.getElementById('stage').classList.toggle('show-safe', this.checked); });</script>
</body>
</html>
