<script>
(function () {
  var wrap = document.getElementById("wrap");
  function h(el) { return el ? Math.round(el.getBoundingClientRect().height * 10) / 10 : "-"; }
  function measure() {
    document.querySelectorAll(".fr").forEach(function (fr) {
      var nav = fr.querySelector(".sb-nav"), items = fr.querySelectorAll(".sb-nav a");
      var content = Math.round(items[items.length - 1].getBoundingClientRect().bottom - nav.getBoundingClientRect().top + nav.scrollTop); var over = content - nav.clientHeight;
      var groups = fr.querySelector(".sb-group");
      fr.querySelector("[data-num]").textContent = "메뉴 칸 " + h(items[0]) + " · 접기 버튼 " + h(fr.querySelector(".sb-btn")) + " · 계정 칸 " + h(fr.querySelector(".sb-menu > summary")) + " · 메뉴 영역 " + nav.clientHeight + " / 메뉴 내용 " + content + " · " + (over > 0 ? "넘침 " + over + "px" : "넘침 없음(여유 " + (-over) + "px)") + " · 묶음 안 간격 " + parseFloat(getComputedStyle(fr.querySelector(".sb-nav ul")).rowGap) + " · 묶음 사이 " + parseFloat(getComputedStyle(groups).marginTop);
    });
  }
  document.querySelectorAll("[data-v]").forEach(function (b) {
    b.addEventListener("click", function () {
      wrap.className = "wrap" + (b.dataset.v === "both" ? "" : " " + b.dataset.v);
      document.querySelectorAll("[data-v]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      history.replaceState(null, "", "#" + b.dataset.v); measure();
    });
  });
  var s = location.hash.slice(1); var t = document.querySelector('[data-v="' + s + '"]'); if (t) t.click(); else measure();
  window.addEventListener("load", measure);
})();
</script></body></html>
