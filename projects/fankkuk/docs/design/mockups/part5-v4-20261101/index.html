<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬꾹 5파트 공개 화면 · 시안 4 기준으로 맞춘 비교</title>
<!--
  2026-11-01 요청: 로그인 전 메인(시안 4)과 결이 다른 네 화면(찾기·크리에이터 상세·팬 홈·크리에이터 홈)을 시안 4 설계 기준(design-prompt.md)으로 맞춘 비교.
  문구·칸 순서·노출 조건은 지금 코드 그대로. 기능 추가 없음. 값은 tokens.md / 메인 시안 4(home-landing-d-20261101).
  「바꾼 뒤」는 이 파일 안의 정적 마크업(컨테이너 쿼리로 PC 1440 / 휴대폰 390 폭에 반응). 카드·화면 데이터는 지금 캡처의 예시 값.
  공용 카드(크리에이터 카드)는 맨 위 스위치로 「지금 그대로 / 그림자 추가(안 B)」를 바꿔 볼 수 있다. 안 B 는 찾기·팬 홈·메인 세 화면이 같이 바뀐다.
  /public/ 경로는 다른 시안과 같이 프로젝트 루트를 서빙할 때 열린다(node scripts/preview.mjs --dir projects/fankkuk).
-->
<style>
@font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Bold.woff') format('woff');font-weight:600 800;font-display:swap}
@font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Medium.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:Tmoney;src:url('/public/fonts/TmoneyRoundWindExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--bg:#F7F9FB;--card:#fff;--line:#DCE3EA;--line-hover:#A9B8C6;--panel-line:#CFE2EE;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.04);--ink:#1F2937;--muted:#55606E;--accent:#0369A1;--num:#7F97AC;--sky:#89CFF0;--sky-50:#EEF7FD;--sky-100:#E0F2FE;--input-line:#AFC0CE;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:var(--ink);font:500 16px/1.6 Pretendard,system-ui,sans-serif;word-break:keep-all}
h1,h2,h3,p,ul,ol{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ===== 비교 페이지 틀 ===== */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.top h1{font:800 18px/1.3 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;margin-right:auto}
.seg{display:flex;gap:4px;padding:4px;background:#E6EBF0;border-radius:12px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.15);font-weight:700}
.seg-label{font-size:14px;color:var(--muted);font-weight:600}
.cmp{padding:24px}
.changes{max-width:1100px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.changes h2{font:800 20px/1.3 Tmoney,Pretendard,sans-serif;margin-bottom:8px}
.changes ul{padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink)}
.changes li{margin-top:4px}.changes li span{color:var(--muted)}
.changes .pcard{margin-top:12px;padding:12px 16px;background:#FFF8E6;border:1px solid #F0D78C;border-radius:12px;font-size:14px;line-height:1.6}
.panes{display:flex;gap:24px;justify-content:center;align-items:flex-start}
.pane{flex:none}
.pane>h3{font-size:14px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.pane>h3 em{font-style:normal;color:var(--muted);font-weight:500;margin-left:8px}
.shot{background:#fff;border:1px solid var(--line);overflow:hidden}
.shot img{display:block;width:100%;height:auto}

/* ===== 바꾼 뒤 화면 (stage) ===== */
.stage{container:st/inline-size;background:var(--bg);position:relative;font-size:16px}
.stage img{display:block;max-width:100%}
.stage a{color:inherit;text-decoration:none}
.stage h1,.stage h2{font-family:Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;font-weight:800;line-height:1.3;color:var(--ink)}
.stage strong{color:var(--accent);font-weight:700}
.wrap{max-width:928px;margin:0 auto;padding:0 24px}
.wrap.w1080{max-width:1128px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font:700 16px/1 Pretendard,sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(180deg,#93D4F2,var(--sky));color:var(--ink);border-color:#6FB8DD;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn-outline{background:#fff;color:var(--ink);border-color:var(--input-line)}
.tl{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700;font-size:16px;white-space:nowrap}
.tl svg{width:16px;height:16px}
.ic{width:20px;height:20px;flex:none}

/* 머리·바닥 */
.hd{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif;min-height:44px}
.logo img{width:32px;height:auto}
.gnb{display:flex;margin-right:auto}
.gnb a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-weight:600;font-size:16px}
.gnb a.on{background:var(--sky-50)}
.acct{display:flex;align-items:center;gap:8px}
.acct .lg{display:flex;align-items:center;min-height:44px;padding:0 12px;font-weight:600}
.mbtn{display:none;width:44px;height:44px;border:0;background:none;color:var(--ink);align-items:center;justify-content:center;margin-left:auto}
.ft{margin-top:96px;background:#F1F4F7;border-top:1px solid var(--line);padding:32px 0 40px;font-size:14px;color:var(--muted)}
.ft .r1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px}
.ft .r1 div,.ft .r2{display:flex;gap:8px 24px;flex-wrap:wrap}
.ft .r2{margin-top:8px}
.ft .biz{margin-top:16px;line-height:1.7}

/* 로그인 후 틀 */
.app{display:grid;grid-template-columns:240px minmax(0,1fr)}
.sb{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;min-height:100%}
.sb .logo{padding:0 8px;margin-bottom:8px}
.sb a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink)}
.sb a.on{background:var(--sky-100)}
.sb a svg{width:20px;height:20px;color:var(--muted)}
.sb .nb{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.app-main{min-width:0}
.mhd{display:none;background:#fff;border-bottom:1px solid var(--line);height:56px;padding:0 16px;align-items:center;justify-content:space-between}

/* 첫 화면 띠(역할 홈) */
.hero{background:#E8F5FD url('/public/images/home/hero-bubbles.png') center/cover no-repeat;padding:48px 0 96px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:32px;align-items:center}
.eyebrow{font-size:16px;font-weight:600;color:var(--muted)}
.hero h1{margin-top:8px;font-size:48px;line-height:1.25}
.hero .art img{width:200px;height:auto}
.search{display:flex;align-items:center;gap:8px;margin-top:32px;max-width:560px;height:64px;padding:0 8px 0 24px;background:#fff;border:1px solid var(--input-line);border-radius:16px;box-shadow:var(--shadow)}
.search.plain{margin-top:24px;max-width:none}
.search span{flex:1;min-width:0;color:#5F6B79;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .btn{min-height:48px;padding:0 20px;border-radius:8px}
.pbar{display:inline-flex;align-items:center;gap:12px;margin-top:24px;padding:8px 16px 8px 8px;background:#fff;border:1px solid var(--panel-line);border-radius:16px;box-shadow:var(--shadow);font-weight:600}
.pbar img{width:40px;height:40px;border-radius:50%;background:var(--sky-50);border:1px solid var(--line);padding:2px}
.vbadge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:#E3F2EA;border:1px solid #BFDCCB;color:#14532D;font-size:12px;font-weight:700}
.vbadge svg{width:12px;height:12px}
.hero .actions{margin-top:24px}

/* 바로가기 */
.quick{position:relative;margin-top:-48px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.quick a{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.quick .q-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sky-50)}
.quick .q-ico img{width:28px;height:28px}
.quick b{display:block;font-size:16px;line-height:1.4}
.quick span.d{display:block;font-size:14px;line-height:1.45;color:var(--muted)}

.banner{margin-top:48px;position:relative}
.banner img{width:100%;height:auto;border-radius:24px;border:1px solid var(--line)}
.banner .cnt{position:absolute;right:16px;bottom:16px;background:rgba(17,24,39,.78);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.bctl{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}
.bctl i{width:44px;height:44px;border-radius:50%;border:1px solid var(--input-line);background:#fff;display:grid;place-items:center}
.bctl i svg{width:16px;height:16px}
.bctl .dots{display:flex;gap:8px;align-items:center;padding:0 8px}
.bctl .dots b{width:8px;height:8px;border-radius:50%;background:#B5C2CF}.bctl .dots b.on{width:24px;border-radius:4px;background:var(--ink)}

/* 구역 */
.sec{margin-top:96px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.sh h2{font-size:32px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2 small{font:600 14px/1 Pretendard,sans-serif;letter-spacing:0;color:var(--muted)}
.lede{margin-top:8px;font-size:16px;color:var(--muted)}
.sb-body{margin-top:24px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lrow{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .av{width:40px;height:40px;border-radius:50%;background:var(--sky-50);border:1px solid var(--line);padding:2px;flex:none}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:16px;line-height:1.4}
.lrow .tx span{display:block;font-size:14px;color:var(--muted);line-height:1.5}
.lrow .tx.one b{font-weight:600}
.lrow>svg{width:20px;height:20px;color:var(--muted);flex:none}
.stt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.stt i{width:8px;height:8px;border-radius:50%;background:currentColor}
.stt.warn{background:#FEF3C7;color:#92400E;border:1px solid #F3D98B}
.stt.info{background:#E0F2FE;color:#075985;border:1px solid #B5DDF3}
.notice .lrow .tx b{font-weight:600}
.notice .dt{font-size:12px;color:var(--muted);font-weight:600}
.empty{display:flex;align-items:flex-start;gap:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty .ei{width:44px;height:44px;border-radius:50%;background:var(--sky-50);display:grid;place-items:center;flex:none;color:var(--accent)}
.empty .ei svg{width:20px;height:20px}
.empty p{font-size:14px;line-height:1.6;color:var(--muted)}
.empty p:first-child{font-size:16px;color:var(--ink);font-weight:600;line-height:44px}
.empty p+p{margin-top:-4px}
.empty .col{min-width:0}

/* 요금 */
.fee{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.fee>div{padding:24px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.fee>div:first-child{border-left:0}
.fee .tag{align-self:flex-start;height:24px;padding:0 12px;border-radius:999px;background:#F1F4F7;font-size:12px;font-weight:700;display:flex;align-items:center}
.fee .pic{height:96px;display:grid;place-items:center;margin:8px 0}
.fee .pic img{width:auto}
.fee .pr{font:800 28px/1.2 Tmoney,sans-serif;letter-spacing:-.02em}.fee .pr small{font-size:14px;margin-left:4px}
.fee .ins{display:flex;align-items:center;gap:6px;margin-top:8px;font-weight:700;font-size:14px}
.fee .ins svg{width:16px;height:16px}
.fee .rg{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.5}
.notes{margin-top:16px;font-size:14px;color:var(--muted);line-height:1.7}

/* 크리에이터 카드 (공용 · 17·32절) */
.cc{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cardB .cc{box-shadow:var(--shadow)}
.cc .bn{position:relative;aspect-ratio:2/1;background:var(--th)}
.cc .bn img{position:absolute;right:8%;top:14%;height:72%;width:auto;opacity:.22}
.cc .bd{padding:0 24px;margin-top:-32px;position:relative;flex:1}
.cc .face{width:64px;height:64px;border-radius:50%;background:#EAF6FD;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;display:grid;place-items:center}
.cc .face img{width:56px;height:56px;object-fit:cover}
.cc .nm{position:absolute;left:100px;right:24px;top:32px}
.cc .nm b{display:block;font-size:16px;font-weight:600;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .nm .vb{display:block;height:22px;margin-top:4px}
.cc .intro{margin-top:20px;font-size:14px;line-height:1.5;color:var(--muted);min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .chips{display:flex;gap:4px;margin-top:12px;flex-wrap:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip i{width:10px;height:10px;border-radius:50%;background:currentColor}
.c-chz{background:#E3F8EF;color:#0B6B4A;border-color:#BCE6D5}
.c-soop{background:#E1F0FA;color:#0B3C5D;border-color:#BBD9EE}
.c-yt{background:#FDE8E6;color:#B42318;border-color:#F7C6C1}
.c-ig{background:#FCE7F3;color:#A21C6B;border-color:#F4C2DD}
.c-x{background:#EEF0F2;color:#111827;border-color:#D5D9DE}
.c-th{background:#EEF0F2;color:#111827;border-color:#D5D9DE}
.c-vt{background:#F1F4F7;color:#374151;border-color:#D5DCE3}
.c-al{background:#E3F4FB;color:#0B5E80;border-color:#BCE0EF}
.cc .strip{display:flex;gap:8px;padding:12px 24px;margin-top:16px}
.cc .strip .sb1{flex:1;min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;background:var(--th);border:1px solid color-mix(in srgb,var(--th),#1F2937 22%);color:#111827}
.cc .strip .sb2{width:44px;min-height:44px;border-radius:12px;background:#fff;border:1px solid var(--input-line);display:grid;place-items:center}
.cc .strip svg{width:16px;height:16px}
.cc .stretch{position:absolute;inset:0}

.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.crow{display:flex;gap:24px;overflow:hidden;position:relative}
.crow .cc{flex:0 0 280px}
.crow .arr{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--input-line);display:grid;place-items:center;box-shadow:var(--shadow)}
.crow .arr svg{width:18px;height:18px}

/* 찾기 */
.cr-banner{margin-top:32px;height:160px;border-radius:24px;border:1px solid #F3CFD6;background:linear-gradient(90deg,#FDE6EA,#FCEEF0);display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.cr-banner h2{font-size:24px}
.cr-banner p{margin-top:4px;font-size:14px;color:var(--muted)}
.cr-banner .btn{margin-top:12px;min-height:44px;padding:0 16px;font-size:14px}
.cr-banner img{height:112px;width:auto}
.ph1{margin-top:48px}
.ph1 h1{font-size:32px}
.ph1 .lede{font-size:16px}
.verify{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
.verify svg{width:16px;height:16px;flex:none}
.fchips{display:flex;gap:8px;margin-top:16px;overflow:hidden;flex-wrap:nowrap}
.fchip{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.fchip i{width:16px;height:16px;border-radius:50%;background:currentColor}
.fchip.on{background:var(--sky-100);border-color:#6FB8DD;font-weight:700}
.count{margin-top:24px;margin-bottom:16px;font-size:14px;color:var(--muted);font-weight:600}

/* 크리에이터 상세 */
.pf-head{margin-top:32px}
.pf-cover{height:280px;border-radius:24px;background:#D3F0EC;position:relative;overflow:hidden}
.pf-cover .h1c{position:absolute;left:34%;top:-4%;width:36%;height:84%;border-radius:50%;background:#F7A8C0}
.pf-cover .h2c{position:absolute;left:12%;top:38%;width:66%;height:80%;border-radius:50%;background:#FCE7A0}
.pf-body{position:relative;padding:0 0 0 264px;min-height:200px}
.pf-face{position:absolute;left:12px;top:-92px;width:184px;height:184px;border-radius:50%;background:#EAF6FD;border:4px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.pf-face img{width:140px;height:140px;object-fit:contain}
.pf-name{padding-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pf-name h1{font-size:32px}
.pf-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
.pf-meta svg.ck{width:16px;height:16px}
.pf-intro{margin-top:16px;font-size:20px;font-weight:600;line-height:1.5}
.pf-thx{margin-top:4px;font-size:14px;color:var(--muted)}
.pf-follow{position:absolute;right:32px;top:40px}
.pf-follow .btn{min-height:48px;padding:0 24px}
.stats{margin-top:48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stats>div{padding:24px 32px}
.stats>div+div{border-left:1px solid var(--line)}
.stats .lb{font-size:14px;color:var(--muted);font-weight:600}
.stats .v{margin-top:4px;font:800 32px/1.2 Tmoney,sans-serif;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.stats .v small{font:600 16px/1 Pretendard,sans-serif;letter-spacing:0;color:var(--muted)}
.sec64{margin-top:64px}
.acc{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.acc .ah{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 24px;font-weight:700;font-size:16px}

const CARD_NOTE='공용 카드 제안(안 B): 크리에이터 카드에 옅은 그림자를 더한다(시안 4 설계 기준 4-6). 지금 승인 기준(design-rules 18절)은 「테두리와 그림자를 같이 쓰지 않는다」라서 부딪힌다. 안 B 를 고르면 찾기 · 팬 홈 팔로우한 크리에이터 · 메인 새 크리에이터 세 화면이 같이 바뀐다. 위 「공용 카드」 스위치로 비교할 수 있다. 안 A 는 지금 그대로다.';
const CARD_USERS={creators:1,'home-fan':1};

/* ---------- 조립 ---------- */
const NOW='../../../../workspace/redesign-v4/part5/now/';
let cur='creators',W=1440,V='both',C='a';

const tabs=$('#tabs');
Object.entries(SCREENS).forEach(([k,s])=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.k=k;b.setAttribute('role','tab');tabs.append(b)});
function draw(){
  const s=SCREENS[cur];
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
  document.querySelectorAll('#widths button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===W));
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===V));
  document.querySelectorAll('#cards button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===C));
  $('#changes').innerHTML=`<h2>${s.label} <span style="font:500 14px Pretendard;color:var(--muted)">${s.route}</span></h2><ul>${s.changes.map(t=>`<li>${t.replace(/\(([^)]*\d-\d+[^)]*|충돌 결정[^)]*|31절)\)\s*$/,'<span>($1)</span>')}</li>`).join('')}</ul>${CARD_USERS[cur]?`<div class="pcard"><b>공용 카드 제안.</b> ${CARD_NOTE.replace('공용 카드 제안(안 B): ','')}</div>`:''}`;
  const n=V==='both'?2:1, avail=document.documentElement.clientWidth-48-24*(n-1);
  const z=Math.min(1,avail/(W*n));
  const nowHtml=`<div class="pane"><h3>지금<em>캡처 · ${W}</em></h3><div class="shot" style="width:${W*z}px"><img src="${NOW}${s.now}-${W}.jpg" alt="지금 화면 ${W}"></div></div>`;
  const aft=`<div class="pane"><h3>바꾼 뒤<em>${W}</em></h3><div class="shot" style="width:${W*z}px"><div style="zoom:${z}"><div class="stage ${C==='b'?'cardB':''}" style="width:${W}px" id="stage">${s.render()}</div></div></div></div>`;
  $('#panes').innerHTML=(V==='both'?nowHtml:'')+aft;
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;draw()}};
$('#widths').onclick=e=>{const b=e.target.closest('button');if(b){W=+b.dataset.w;draw()}};
$('#views').onclick=e=>{const b=e.target.closest('button');if(b){V=b.dataset.v;draw()}};
$('#cards').onclick=e=>{const b=e.target.closest('button');if(b){C=b.dataset.c;draw()}};
addEventListener('resize',draw);
const q=new URLSearchParams(location.search);
if(q.get('s')&&SCREENS[q.get('s')])cur=q.get('s');if(q.get('w'))W=+q.get('w');if(q.get('v'))V=q.get('v');if(q.get('c'))C=q.get('c');
draw();
</script>
