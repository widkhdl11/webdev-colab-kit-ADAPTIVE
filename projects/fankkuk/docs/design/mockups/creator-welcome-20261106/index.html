<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팬꾹 · 크리에이터 홈 인사 영역 시안</title>
  <style>
    @font-face {
      font-family: Tmoney;
      src: url("../../../../public/fonts/TmoneyRoundWindExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 "Malgun Gothic", sans-serif; color: #1f2937; word-break: keep-all; }
    .wrap { width: min(880px, calc(100% - 64px)); margin-inline: auto; }
    .hero { background: #e3f3fe url("../../../../public/images/home/hero-bubbles.png") center / cover no-repeat; }
    .hero-inner { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 54px 0 88px; }
    .copy { min-width: 0; }
    h1 { margin: 4px 0 0; font: 800 clamp(32px, 4.4vw, 48px)/1.3 Tmoney, sans-serif; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .intro { margin: 0; color: #475569; font-size: 15px; font-weight: 600; }
    .fandom { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 0; }
    .fandom dt { color: #536677; font-size: 14px; }
    .fandom dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .edit { display: inline-flex; align-items: center; min-height: 44px; margin-top: 24px; padding: 8px 22px; border-radius: 10px; background: #89cff0; font-weight: 700; }
    .mascot { width: 200px; height: auto; flex: none; }
    .links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: -36px; padding-bottom: 24px; }
    .tile { padding: 16px; background: white; border: 1px solid #dce5eb; border-radius: 16px; box-shadow: 0 4px 12px #1f29370b; }
    .tile img { display: block; width: 40px; height: 40px; object-fit: contain; padding: 6px; border-radius: 50%; background: #f0f8ff; margin-bottom: 8px; }
    .tile strong, .tile small { display: block; }
    .tile small { margin-top: 4px; color: #536677; font-size: 14px; }
    @media (max-width: 650px) {
      .wrap { width: calc(100% - 36px); }
      .hero-inner { gap: 8px; padding: 36px 0 64px; position: relative; }
      .intro { font-size: 14px; }
      .mascot { position: absolute; width: 76px; right: 0; bottom: 52px; }
      .fandom { margin-top: 12px; max-width: calc(100% - 76px); }
      .edit { margin-top: 18px; }
      .links { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: -24px; }
    }
    body { background: #f5f8fb; }
    main { max-width: 1180px; margin: 0 auto; padding: 44px 40px 60px; }
    .brand { display: flex; align-items: center; gap: 8px; font: 800 22px Tmoney; margin-bottom: 32px; }
    .brand img { width: 32px; height: 32px; }
    .wrap { width: 100%; }
    .hero { background: white; border-radius: 32px; overflow: hidden; border: 1px solid #dce7ee; }
    .hero-inner { display: grid; grid-template-columns: 1.15fr 1fr; gap: 0; padding: 0; align-items: stretch; }
    .copy { padding: 56px 48px; display: flex; flex-direction: column; justify-content: center; }
    .intro { font-size: 14px; color: #526c7e; margin-bottom: 22px; }
    h1 { font-size: 48px; line-height: 1.35; margin: 0; }
    h1 span { color: #477d99; }
    .description { margin: 24px 0 0; color: #526170; line-height: 1.8; }
    .empty { display: flex; align-items: center; gap: 10px; margin-top: 32px; font-size: 14px; color: #465d6c; }
    .empty svg { width: 22px; height: 22px; flex: none; }
    .fan-space { position: relative; min-height: 420px; background: #dbf1fc; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; overflow: hidden; }
    .fan-space:before { content: ''; position: absolute; width: 330px; height: 330px; border: 1px solid #ffffffbb; border-radius: 50%; top: 82px; }
    .fan-space:after { content: ''; position: absolute; width: 430px; height: 430px; border: 1px solid #ffffff88; border-radius: 50%; top: 32px; }
    .fandom { position: relative; z-index: 1; display: block; margin: 0; text-align: center; max-width: 100%; }
    .fandom dt { font-size: 14px; margin-bottom: 2px; }
    .fandom dd { font: 800 38px/1.4 Tmoney; color: #315a72; }
    .mascot { position: relative; z-index: 1; width: 208px; height: 208px; object-fit: contain; margin-top: 22px; right: auto; bottom: auto; }
    .links { gap: 0; margin-top: 24px; padding: 0; border: 1px solid #dce7ee; border-radius: 20px; background: white; overflow: hidden; }
    .tile { position: relative; border: 0; border-radius: 0; box-shadow: none; padding: 26px; }
    .tile + .tile { border-left: 1px solid #e7edf2; }
    .tile img { width: 44px; height: 44px; margin-bottom: 18px; padding: 4px; background: none; border-radius: 0; }
    .tile:after { content: '↗'; position: absolute; right: 24px; top: 26px; color: #6b8597; font-size: 20px; }
    .tile strong { font-size: 16px; }
    .tile small { margin-top: 6px; }
    @media (max-width: 750px) {
      main { padding: 24px 18px 36px; }
      .brand { margin-bottom: 24px; }
      .hero { border-radius: 24px; }
      .hero-inner { grid-template-columns: 1fr; }
      .copy { padding: 32px 26px; }
      h1 { font-size: 36px; }
      .intro { margin-bottom: 16px; }
      .description { margin-top: 18px; }
      .empty { margin-top: 22px; }
      .fan-space { min-height: 260px; padding: 28px; flex-direction: row; gap: 20px; justify-content: center; }
      .fan-space:before { top: -20px; }
      .fan-space:after { top: -70px; }
      .fandom { text-align: left; }
      .fandom dd { font-size: 30px; }
      .mascot { width: 148px; height: 148px; margin: 0; }
      .links { grid-template-columns: repeat(2, 1fr); margin-top: 18px; }
      .tile { padding: 20px; }
      .tile:nth-child(3) { border-left: 0; }
      .tile:nth-child(n+3) { border-top: 1px solid #e7edf2; }
      .tile:after { right: 18px; top: 20px; }
    }
    @media (max-width: 360px) {
      .copy { padding: 28px 22px; }
      h1 { font-size: 32px; }
      .fan-space { padding: 22px; gap: 10px; min-height: 220px; }
      .mascot { width: 128px; height: 128px; }
      .tile { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="../../../../public/images/logo-mark.png" alt="">팬꾹</div>
    <section class="hero" aria-labelledby="welcome">
      <div class="wrap hero-inner">
        <div class="copy">
          <p class="intro">나의 팬꾹</p>
          <h1 id="welcome">히든왕님,<br><span>반가워요</span></h1>
          <p class="description">팬들이 보낸 선물과<br>승인 요청을 여기서 확인하세요.</p>
          <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>지금은 처리할 일이 없어요</div>
        </div>
        <div class="fan-space">
          <dl class="fandom"><dt>함께하는 팬덤</dt><dd>히든단</dd></dl>
          <img class="mascot" src="../../../../public/images/home/creator-cat.webp" alt="">
        </div>
      </div>
    </section>
    <div class="wrap links">
      <div class="tile"><img src="../../../../public/images/home/icon-approve.webp" alt=""><strong>지금 할 일</strong><small>0건</small></div>
      <div class="tile"><img src="../../../../public/images/home/icon-gift.webp" alt=""><strong>선물 현황</strong><small>진행 중 0건</small></div>
      <div class="tile"><img src="../../../../public/images/home/icon-truck.webp" alt=""><strong>보낸 선물</strong><small>0개</small></div>
      <div class="tile"><img src="../../../../public/images/home/icon-help.webp" alt=""><strong>주소 열람 기록</strong><small>배송지 열람 내역</small></div>
    </div>
  </main>
</body>
</html>
