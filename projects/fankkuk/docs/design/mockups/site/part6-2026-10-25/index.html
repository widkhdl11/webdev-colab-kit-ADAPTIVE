<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>6파트 로그인·비밀번호·가입 — 지금 / 바꾼 뒤</title>
<!-- 6파트 시안 목록 2026-10-25. 진단: docs/design/redesign-2026-10-25-part6.md. 왼쪽 now/ 는 실제 사이트 캡처, 오른쪽 shots/ 는 시안 캡처(같은 폭). 5절 다섯 가지는 모두 추천(①)으로 그렸다.
     지금 사이트에 없는 화면(비밀번호 찾기 따로 화면의 처음·보내는 중이 아닌 것, 로그인 틀림·보내는 중, 새 비밀번호 바꾸는 중, 가입 3단계 요청 보냄)은 왼쪽이 비어 있다. -->
<style>
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #d1d5db;padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header p{margin:4px 0 0;font-size:14px;color:#4b5563}
.modes{margin-left:auto;display:flex;gap:8px}
.modes button{min-height:44px;padding:0 16px;border:1px solid #9ca3af;border-radius:12px;background:#fff;font-size:14px;cursor:pointer}
.modes button[aria-pressed=true]{background:#111827;color:#fff;border-color:#111827}
section{padding:32px 24px;border-bottom:1px solid #d1d5db}
section h2{font-size:20px;margin:0 0 4px}section h2 code{font-size:14px;color:#4b5563;font-weight:400}
section ul{margin:8px 0 16px;padding-left:20px;font-size:14px;color:#374151}
h3{font-size:16px;margin:24px 0 8px}
a.open{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:#0b6aa8}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.cmp figure{margin:0;background:#fff;border:1px solid #d1d5db;border-radius:12px;overflow:hidden}
.cmp figcaption{padding:8px 12px;font-size:13px;font-weight:600;border-bottom:1px solid #e5e7eb}
.cmp img{width:100%;display:block}
.cmp .none{padding:32px 16px;font-size:14px;color:#4b5563;text-align:center}
body.w390 .cmp{grid-template-columns:repeat(2,minmax(0,390px));justify-content:center}
@media (max-width:767px){.cmp,body.w390 .cmp{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><h1>6파트 로그인·비밀번호·가입 — 지금 / 바꾼 뒤</h1><p>왼쪽이 지금 사이트, 오른쪽이 시안이에요. 「시안 열기」로 들어가면 회색 막대에서 상태를 바꾸고, 바뀐 곳 번호를 켜 볼 수 있어요. 노란 「문구 후보」는 새로 정해야 할 문구예요.</p></div>
<div class="modes"><button type="button" data-w="1440" aria-pressed="true">PC 1440</button><button type="button" data-w="390" aria-pressed="false">모바일 390</button></div></header>
<main id="list"></main>
<script>
// [슬러그, 이름, 주소, 바뀐 점, 시안 파일, [[상태 이름, 시안 상태 식별자, 시안 캡처 이름, 지금 캡처 이름 또는 null]]]
const pages = [
  ['login','로그인','/login',['머리를 카드 밖 위로, 선물 그림 뺌, 설명 16/500 → 16/400','「로그인 상태 유지」 확인칸 뺌(동작이 없던 입력)','접는 「비밀번호를 잊으셨나요?」 칸 → 카드 아래 가운데 링크 한 줄(따로 열리는 화면으로)'],'login',[
    ['처음','idle','login','login'],['보내는 중','busy','login-busy',null],['오류 · 빈 칸','empty','login-empty','login-empty'],['오류 · 틀림','wrong','login-wrong',null],['잠김','locked','login-locked','login-locked-dom']]],
  ['password-forgot','비밀번호 찾기','/password/forgot (새 화면, 가칭)',['로그인 접는 칸 안의 재설정 요청을 따로 열리는 화면으로 — 한 카드에 아이디 칸이 두 번 나오던 것이 없어짐','「재설정 링크 보내기」가 이 화면의 채운 버튼 하나','제목 「비밀번호 찾기」·링크 「로그인으로 돌아가기」는 문구 후보'],'password-forgot',[
    ['요청 처음','request','forgot','login-reset-open'],['보내는 중','sending','forgot-sending',null],['오류 · 빈 칸','error','forgot-empty','login-reset-empty'],['메일 보냄','answered','forgot-sent','login-reset-sent-dom']]],
  ['password-reset','새 비밀번호 정하기','/password/reset',['머리를 카드 밖으로, 설명 16/400','「비밀번호가 서로 달라요.」가 칸 바로 아래 「!」 줄로(가입과 같은 모양)','링크 오류 문장 둘·버튼 글자 둘을 요청 화면이 따로 생긴 것에 맞춰 하나로 — 문구 후보'],'password-reset',[
    ['칸 처음','ready','reset-ready','reset-ready'],['바꾸는 중','sending','reset-sending',null],['칸 오류','mismatch','reset-field-error','reset-field-error-dom'],['링크 값 없음','notoken','reset-no-token','reset-no-token'],['링크 죽음','dead','reset-link-dead','reset-link-dead'],['바뀜','done','reset-done','reset-done-dom']]],
  ['signup','회원가입','/signup',['단계 표시는 알약 줄 하나 — 카드 머리 번호 동그라미·390 「1 / 3 단계」 줄 뺌, 390 도 한 줄','「크리에이터로 가입하면 …」 안내는 「크리에이터예요」를 골랐을 때만','크리에이터 하늘 판 → 구분선 + 소제목 묶음 넷(소제목은 문구 후보), 갈 곳 없는 「보기」 뺌, 굵기 700 → 600'],'signup',[
    ['1단계 · 팬','s1-fan','signup-1-fan','signup-1-fan'],['1단계 · 크리에이터','s1-creator','signup-1-creator','signup-1-creator'],['2단계 · 팬','s2-fan','signup-2-fan','signup-2-fan'],['2단계 · 크리에이터','s2-creator','signup-2-creator','signup-2-creator'],['2단계 · 칸 오류','s2-err','signup-2-creator-errors','signup-2-creator-errors'],['3단계','s3','signup-3','signup-3'],['3단계 · 요청 보냄','s3-sent','signup-3-sent',null]]],
];
const list = document.getElementById('list');
list.innerHTML = pages.map(([slug,name,path,notes,file,states]) => `<section><h2>${name} <code>${path}</code></h2><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul>${states.map(([sn,st,shot,now]) => `<h3>${sn}</h3><div class="cmp"><figure><figcaption>지금</figcaption>${now?`<img data-src="now/${now}" alt="${name} ${sn} 지금 화면" loading="lazy">`:`<p class="none">지금 사이트에는 없는 화면이에요(캡처 없음)</p>`}</figure><figure><figcaption>바꾼 뒤 · <a class="open" href="${file}.html#${st}">시안 열기</a></figcaption><img data-src="shots/${shot}" alt="${name} ${sn} 시안" loading="lazy"></figure></div>`).join('')}</section>`).join('');
function setW(w){document.body.classList.toggle('w390', w === '390');document.querySelectorAll('img[data-src]').forEach(i => { i.src = i.dataset.src + '-' + w + '.png'; });document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === w)));}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setW(b.dataset.w)));
setW('1440');
</script>
</body></html>
