<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 전후 비교</title>
<style>
  :root { --bg:#f8fafc; --ink:#111827; --sub:#4b5563; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Pretendard, system-ui, sans-serif; }
  .wrap { max-width: 1880px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p.lead { margin: 0 0 32px; color: var(--sub); }
  h2 { font-size: 20px; margin: 48px 0 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .row.narrow { grid-template-columns: repeat(2, minmax(0, 390px)); justify-content: start; gap: 48px; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  figcaption { font-weight: 600; margin-bottom: 12px; }
  figcaption span { font-weight: 400; color: var(--sub); font-size: 14px; margin-left: 8px; }
  img { display: block; width: 100%; height: auto; border-radius: 8px; }
  ul { margin: 0; padding-left: 20px; color: var(--sub); line-height: 1.7; }
  @media (max-width: 900px) { .row, .row.narrow { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>크리에이터 카드 — 전 · 후</h1>
  <p class="lead">같은 로컬 데이터(크리에이터 12명), 로그인 전, 개발 서버에서 찍었다. 전 = 커밋 299890ea, 후 = 5ec7a9f5.</p>

  <h2>PC 1440 폭</h2>
  <div class="row">
    <figure><figcaption>전<span>사진 56 가운데 · 팔로우는 배너 모서리 · 승인 시간 없음</span></figcaption><img src="compare/before-1440.png" alt="바꾸기 전 카드 격자, 1440 폭"></figure>
    <figure><figcaption>후<span>사진 64 왼쪽 · 이름+뱃지 한 줄 · 아래 줄에 승인 시간+팔로우</span></figcaption><img src="compare/after-1440.png" alt="바꾼 뒤 카드 격자, 1440 폭"></figure>
  </div>

  <h2>휴대폰 390 폭 (앞 두 장)</h2>
  <div class="row narrow">
    <figure><figcaption>전</figcaption><img src="compare/before-390.png" alt="바꾸기 전 카드, 390 폭"></figure>
    <figure><figcaption>후</figcaption><img src="compare/after-390.png" alt="바꾼 뒤 카드, 390 폭"></figure>
  </div>
</div>
</body>
</html>
