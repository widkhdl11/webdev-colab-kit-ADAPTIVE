<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>팬꾹 푸터 시안 비교</title>
  <link rel="icon" href="http://localhost:3000/images/logo-mark.png">
  <style>
    @font-face{font-family:Pretendard;src:url('../v34-part1/Pretendard-Medium.woff') format('woff');font-weight:400 600;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2937;font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;word-break:keep-all}button{font:inherit;cursor:pointer;border:0;border-radius:8px;min-height:44px;padding:8px 16px;background:transparent;color:#4b5563}button:hover{background:#f3f4f6}button[aria-pressed=true]{background:#e0f2fe;color:#1f2937;font-weight:600}button:focus-visible{outline:2px solid #1f2937;outline-offset:3px}.toolbar{background:#f9fafb;padding:16px 24px}.toolbar-inner{max-width:1120px;margin:auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}.title{font-size:16px;font-weight:600;margin:0 8px 0 0}.controls{display:flex;gap:4px}.width-controls{margin-left:auto}.note{max-width:1120px;margin:12px auto 0;color:#4b5563}.preview{width:100%;margin:0 auto;transition:width .2s ease}.preview.phone{width:390px;max-width:100%}iframe{width:100%;display:block;border:0;background:#fff;height:360px}.measurement{font-variant-numeric:tabular-nums;margin:0 0 0 auto;white-space:nowrap}@media(max-width:600px){.toolbar{padding:12px 16px}.toolbar-inner{gap:8px 12px}.title{flex-basis:100%}.width-controls{margin-left:0}.measurement{margin-left:0}.note{margin-top:12px}.preview{transition:none}}@media(prefers-reduced-motion:reduce){.preview{transition:none}}
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <h1 class="title">푸터 시안</h1>
      <div class="controls" aria-label="시안 선택"><button type="button" data-view="footer" aria-pressed="true">제안</button><button type="button" data-view="current" aria-pressed="false">현재</button></div>
      <div class="controls width-controls" aria-label="미리보기 너비"><button type="button" data-width="full" aria-pressed="true">전체 폭</button><button type="button" data-width="phone" aria-pressed="false">휴대폰</button></div>
      <p class="measurement" aria-live="polite">푸터 높이 확인 중</p>
    </div>
    <p class="note">메뉴는 가로로, 사업자 정보는 짧은 줄로. 기존 링크와 정보를 모두 유지한 시안입니다.</p>
  </header>
  <main class="preview"><iframe title="푸터 미리보기" src="footer.html"></iframe></main>
  <script>
    const frame=document.querySelector('iframe');const preview=document.querySelector('.preview');const measurement=document.querySelector('.measurement');let observer;
    function measure(){const doc=frame.contentDocument;if(!doc)return;const footer=doc.querySelector('footer');if(!footer)return;frame.style.height=doc.body.scrollHeight+'px';measurement.textContent='푸터 높이 '+Math.round(footer.getBoundingClientRect().height)+'px';}
    frame.addEventListener('load',()=>{if(observer)observer.disconnect();observer=new ResizeObserver(measure);observer.observe(frame.contentDocument.body);frame.contentDocument.fonts.ready.then(measure);measure();});
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));frame.src=button.dataset.view+'.html';}));
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));preview.classList.toggle('phone',button.dataset.width==='phone');}));
    addEventListener('resize',measure);
  </script>
</body>
</html>
