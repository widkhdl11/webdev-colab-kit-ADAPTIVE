<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팬꾹 — 글꼴 후보 비교 (A 글자 체계)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="fonts.js"></script>
<style>
:root{--ink:#343039;--sub:#665D65;--brand:#B84F48;--border:#DFDCE0;--surface:#F7F7F8}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:1200px;margin:0 auto;padding:56px 24px 96px}
.page-h{font-size:28px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
.page-p{color:var(--sub);margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{border:1px solid var(--border);border-radius:20px;padding:32px}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);font-family:"Pretendard Variable",Pretendard,sans-serif}
.meta b{font-size:20px}
.meta a{color:var(--brand);font-weight:600;white-space:nowrap}
.note{color:var(--sub);margin:-12px 0 24px;font-family:"Pretendard Variable",Pretendard,sans-serif}
.kicker{font-size:16px;font-weight:600;color:var(--sub);margin:0 0 8px}
.h1{font-size:40px;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin:0 0 8px}
.green{font-size:18px;font-weight:600;color:var(--brand);margin:0 0 28px}
.h2{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-.02em;margin:0 0 6px}
.h2 .accent{color:var(--brand)}
.lead{color:var(--sub);margin:0 0 20px}
.box{border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
.h3{font-size:20px;font-weight:600;margin:0 0 4px}
.body{margin:0}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;border:0}
.price{font-size:40px;font-weight:700;letter-spacing:-.02em}
.price span{font-size:18px;margin-left:2px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (max-width:767px){.wrap{padding:40px 16px 72px}.card{padding:24px 20px}.h1{font-size:30px}.h2{font-size:24px}.meta{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="page-h">글꼴 후보 비교</h1>
  <p class="page-p">A 글자 체계(제목 40·구간 28·카드 20·본문 16, 굵기 700·600·400)를 그대로 두고 글꼴만 바꿨어요. 「랜딩 전체 보기」로 실제 화면에서도 볼 수 있어요.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
(function(){
  var F = window.FONT_CANDIDATES, grid = document.getElementById("grid");
  var loaded = {};
  var set = new URLSearchParams(location.search).get("set");
  if (set === "cute") { document.querySelector(".page-h").textContent = "글꼴 후보 비교 — 귀여운 쪽"; }
  Object.keys(F).forEach(function(k){
    var f = F[k];
    if (set === "cute" && f.group !== "cute") return;
    f.css.forEach(function(h){ if(loaded[h]) return; loaded[h]=1; var l=document.createElement("link"); l.rel="stylesheet"; l.href=h; document.head.appendChild(l); });
    var fb = ',-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    var q = function(s){ return s.replace(/"/g, "'"); };
    var body = q(f.body + fb), head = q((f.head || f.body) + fb);
    var hs = 'font-family:' + head + (f.head ? ';letter-spacing:0' : '');
    if (f.headWeight) hs += ';font-weight:' + f.headWeight;
    var bw = f.headWeight ? ' style="font-weight:' + f.headWeight + '"' : '';
    var c = document.createElement("section"); c.className = "card"; c.setAttribute("aria-label", f.label);
    c.innerHTML =
      '<div class="meta"><b>' + f.label + '</b><a href="landing-a.html' + (k === "pretendard" ? "" : "?font=" + k) + '">랜딩 전체 보기 ›</a></div>' +
      '<p class="note">' + f.note + '</p>' +
      '<div style="font-family:' + body + (f.synth ? ';font-synthesis:none' : '') + '">' +
        '<p class="kicker">크리에이터에게 선물을 보낼 때</p>' +
        '<p class="h1" style="' + hs + '">승인한 선물만 배송합니다</p>' +
        '<p class="green">모든 선물은 팬꾹에서 검수한 뒤 보냅니다.</p>' +
        '<p class="h2" style="' + hs + '">선물은 <span class="accent">4단계</span>로 도착해요</p>' +
        '<p class="lead">팬은 팬꾹으로 보내고, 크리에이터는 승인만 하면 돼요.</p>' +
        '<div class="box"><p class="h3" style="' + hs + '">주소는 잠긴 채 보관합니다</p><p class="body">승인된 선물의 송장을 출력할 때만 열려요. 언제, 어느 주문에서 열렸는지 크리에이터가 직접 볼 수 있어요.</p></div>' +
        '<div class="row"><span class="price" style="' + hs + '">6,900<span>원</span></span><button class="btn" type="button"' + bw + '>지금 바로 선물 보내러 가기</button></div>' +
      '</div>';
    grid.appendChild(c);
  });
})();
</script>
</body>
</html>
