<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬꾹 승인 취소 · 크리에이터 화면 시안</title>
<!--
  2026-11-02 요청: 크리에이터 화면에 「승인 취소」 버튼과 확인 창을 얹은 시안. 새 시각 방향이 아니다.
  바탕: part2-v4-20261101(승인 내역 · 선물 현황)의 CSS·마크업 그대로. 팬 상세는 part1-v4-20261101(선물 상세 「보내는 중」)을 iframe 안에 그대로 두고 배지·승인 행·「먼저 보내기」 쪽 안내 한 줄만 뺐다.
  확인 창 모양: src/shared/ui/bottom-sheet.module.css + dialog-parts.module.css (받지 않기 확인과 같은 창 · 휴대폰은 아래에서 올라오는 시트, 768 이상은 가운데 창 480).
  문구 근거: docs/ux/pages/creator-requests.md 상태표 (글자 그대로).
  새 색 · 새 간격 없음. 「승인 취소」 버튼: 줄·카드는 선 버튼 작은 것(btn line sm), 창 안은 받지 않기 확인과 같은 기본 버튼(위험 동작 전용 색이 따로 없다).
  장면 안 화면은 PC 1440 과 휴대폰 390 을 위아래로 둔다(틀 안 가로 스크롤).
-->

<style>
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Medium.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Bold.woff') format('woff');font-weight:700 800;font-display:swap}
@font-face{font-family:Tmoney;src:url('assets/TmoneyRoundWindExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--ink:#1F2937;--sub:#4B5563;--muted:#55606E;--line:#DCE3EA}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:var(--ink);font:500 16px/1.6 Pretendard,system-ui,sans-serif;word-break:keep-all}
h1,h2,h3,p,ul,ol,dl,dd,dt{margin:0}
ul,ol{padding:0;list-style:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ===== 비교 페이지 틀 ===== */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.top h1{font:800 18px/1.3 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;margin-right:auto}
.seg{display:flex;gap:4px;padding:4px;background:#E6EBF0;border-radius:12px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.15);font-weight:700}
.seg-label{font-size:14px;color:var(--muted);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px}
.cmp{padding:24px}
.changes{max-width:1100px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.changes h2{font:800 20px/1.3 Tmoney,Pretendard,sans-serif;margin-bottom:8px}
.changes h2 span{font:500 14px Pretendard;color:var(--muted);margin-left:8px}
.changes h4{margin:12px 0 0;font-size:14px}
.changes ul{padding-left:20px;list-style:disc;font-size:14px;line-height:1.7}
.changes li{margin-top:4px}
.sub-bar{max-width:1100px;margin:0 auto 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panes{display:flex;gap:24px;justify-content:center;align-items:flex-start}
.pane{flex:none}
.pane>h3{font-size:14px;font-weight:700;margin:0 0 8px}
.pane>h3 em{font-style:normal;color:var(--muted);font-weight:500;margin-left:8px}
.shot{background:#fff;border:1px solid var(--line);overflow:hidden}
.shot>img{display:block;width:100%;height:auto}

/* ===== 화면(바꾼 뒤 = 기본, 지금 재현 = .now 가 되돌림) ===== */
.stage{container:st/inline-size;--primary:#89CFF0;--p50:#E0F2FE;--tint:#F0F8FF;--tl:#BFE3F7;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g500:#6B7280;--sub:#4B5563;--ink:#1F2937;
  --info:#315E86;--info-soft:#EDF4FA;--warn:#805B16;--warn-soft:#FFF5DB;--succ:#276749;--succ-soft:#EAF5EE;--danger:#B42318;--danger-soft:#FEECE9;--alert50:#FFFBEB;--alert200:#FDE68A;
  --fx-accent:radial-gradient(120% 140% at 100% 0%,rgb(255 255 255/.9) 0%,rgb(255 255 255/0) 45%),radial-gradient(80% 120% at 0% 100%,rgb(137 207 240/.28) 0%,rgb(137 207 240/0) 60%),linear-gradient(135deg,#f0f8ff 0%,#e0f2fe 100%);
  --sh-accent:inset 0 1px 0 rgb(255 255 255/.8),0 8px 24px rgb(137 207 240/.18);
  --fx-card:radial-gradient(90% 120% at 100% 0%,rgb(137 207 240/.07) 0%,rgb(137 207 240/0) 55%),linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
  --sh-card:inset 0 1px 0 #fff,0 1px 2px rgb(31 41 55/.04),0 4px 12px rgb(31 41 55/.04);
  --hair:inset 0 0 0 1px var(--g200);
  --fx-btn:linear-gradient(180deg,#95d4f2 0%,#89cff0 100%);
  background:#fff;position:relative;font-size:16px;line-height:1.6;color:var(--ink)}
.stage a{color:inherit;text-decoration:none}
.stage h1,.stage h2,.stage h3{font-family:Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;font-weight:800;line-height:1.3;color:var(--ink)}
.stage svg{flex:none}
.app{display:flex;min-height:900px}
.sb{flex:none;width:240px;background:var(--tint);border-right:1px solid var(--g200);display:flex;flex-direction:column;padding:0 8px 8px}
.sb-top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 8px}
.sb-top .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.logo img{width:28px;height:28px;border-radius:22%}
.sb nav{flex:1}
.sb nav a{display:flex;align-items:center;gap:12px;height:36px;margin-bottom:2px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500}
.sb nav a[aria-current]{background:var(--p50);font-weight:600}
.sb nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb nav .n{margin-left:auto;display:grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--primary);font-size:14px;font-weight:700;line-height:1}
.sb .me{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;font-size:14px;font-weight:600;border-top:1px solid var(--g200)}
.me i{width:28px;height:28px;border-radius:50%;background:var(--p50)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{display:none;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid var(--g200);background:#fff}
.tb .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.tb button{width:44px;height:44px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pane-main{flex:1;width:100%;padding:40px;min-width:0;container:pane/inline-size}
.col{max-width:880px;margin-inline:auto}
.col.w1040{max-width:1040px}
.ft{background:var(--g50);padding:40px 0;font-size:14px;color:var(--sub)}
.ft .in{max-width:928px;margin:0 auto;padding:0 24px}
.ft .r1,.ft .r2{display:flex;flex-wrap:wrap;gap:0 24px;justify-content:space-between}
.ft a{display:inline-flex;align-items:center;min-height:44px}
.ft .biz{margin-top:8px;line-height:1.7}

/* 페이지 머리 — 지금: 제목 24 / 바꾼 뒤: 제목 32 (휴대폰 24) */
.ph{margin-bottom:32px}
.phrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.ph h1{font-size:32px;line-height:1.3}
.cnt{margin-left:8px;font:400 16px Pretendard;color:var(--g500);letter-spacing:0}
.phd{margin-top:8px;max-width:680px;color:var(--sub);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;min-width:96px;border:0;border-radius:12px;background:var(--fx-btn);color:var(--ink);font:600 16px/1.4 Pretendard,sans-serif;white-space:nowrap;box-shadow:inset 0 1px 0 rgb(255 255 255/.45),0 1px 2px rgb(31 41 55/.06)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--g500)}
.now .btn.line{box-shadow:inset 0 0 0 1px var(--g400)}
.btn.sm{min-height:44px;min-width:0}
/* 글자 버튼(base.css .btn--text) — 테두리·면 없이 보조 글자색, 눌림 칸 44 유지. 2026-11-02 사용자 「테두리 없는 버튼」 */
.btn.text{background:none;box-shadow:none;color:var(--sub);font-weight:500;padding:0 8px}
.btn.text:hover{background:var(--g100)}
.lr .btn.text.sm{margin-block:-8px}
.btn.block{width:100%}

/* 상태 뱃지 — 지금: 글자만(400) / 바꾼 뒤: 점 + 글자(700), 팬 홈 .stt 와 같은 모양 (35절) */
.tg{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:4px 12px;border-radius:9999px;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.tg::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.tg.warn{background:var(--warn-soft);color:var(--warn)}
.tg.succ{background:var(--succ-soft);color:var(--succ)}
.tg.danger{background:var(--danger-soft);color:var(--danger)}
.tg.white{background:#fff}
.tg.white.warn{background:var(--warn-soft)}
.tg.nodot::before{display:none}
.now .tg{min-height:0;gap:0;padding:8px 16px;font-weight:600;line-height:1}
.now .tg::before{display:none}
.tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.now .tg.keep-icon{gap:8px}

/* 탭 — 지금: 밑줄 하늘 2px(1.8:1) / 바꾼 뒤: 44 높이, 고른 탭 --primary-50 면 + 밑줄 2px --brand-line */
.tabs{display:flex;gap:8px;margin:0 0 24px;box-shadow:inset 0 -1px 0 var(--g200)}
.tabs span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;color:var(--sub);font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.tabs span[aria-selected=true]{background:var(--p50);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.now .tabs{gap:24px}
.now .tabs span{padding:0;min-height:44px;font-weight:400;color:var(--sub)}
.now .tabs span[aria-selected=true]{background:none;font-weight:700;color:var(--ink);box-shadow:inset 0 -2px 0 var(--primary)}

.btn.line.sm{min-height:44px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.changes code{font-size:13px;background:#F3F4F6;padding:1px 4px;border-radius:4px}


/* ===== 공통 부품 (바꾼 뒤 = 기본, .now 가 지금 값으로 되돌림) ===== */
.ph{margin-bottom:0}
.ph .phd{margin-top:8px}
.ph h1{font-size:32px}
.sec{margin-top:48px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sech h2{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.sech h2 small{margin-left:8px;font-size:14px;font-weight:500;color:var(--sub)}
.sech a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.fc{flex:none;width:32px;height:32px;border-radius:50%;background:var(--p50);box-shadow:inset 0 0 0 1px rgb(31 41 55/.08);display:grid;place-items:center;overflow:hidden}
.fc img{width:26px;height:26px;object-fit:contain}
.fc.lg{width:48px;height:48px}.fc.lg img{width:38px;height:38px}
.fc.md{width:40px;height:40px}.fc.md img{width:32px;height:32px}
.gc{background:linear-gradient(180deg,#f9f9fa 0%,#f4f5f7 100%);box-shadow:inset 0 0 0 1px var(--g200)}
.now .gc{box-shadow:inset 0 1px 0 rgb(255 255 255/.9)}
.card{border-radius:16px;background:var(--fx-card);box-shadow:var(--hair),var(--sh-card)}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 24px;border-radius:16px;background:var(--fx-card);box-shadow:var(--hair),var(--sh-card);text-align:center;color:var(--sub)}
.empty img{width:72px;height:72px;object-fit:contain}
.empty h2{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0;color:var(--ink)}
.now .empty.nocard{background:none;box-shadow:none}
.now .empty.nocard img{width:96px;height:96px}
.now .empty.one{padding:24px}
.now .empty.plain{align-items:flex-start;background:none;box-shadow:none;padding:16px 12px;font-size:14px;text-align:left}
.num48{margin:0;font:800 48px/1.2 Tmoney,sans-serif;letter-spacing:-1.5px;color:var(--ink)}
.num48 small{margin-left:4px;font:600 16px Pretendard,sans-serif;letter-spacing:0;color:var(--sub)}
.lab{display:block;font-size:14px;font-weight:700;color:var(--sub)}

/* 촘촘한 줄 — 지금: 안쪽 12 / 바꾼 뒤: 안쪽 32(휴대폰 24), 강조 칸 안쪽과 같음 */
.rows{margin-top:12px;border-top:1px solid var(--g200)}
.lr{position:relative;display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 32px;border-bottom:1px solid var(--g200)}
.now .lr{padding:8px 12px}
.lr-txt{flex:1;min-width:0}
.now .lr-txt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lr.sent .lr-txt{flex:0 0 200px}
.lr.sent .lr-side{flex:1 1 auto;justify-content:flex-start}
.now .lr.sent .lr-txt{flex:1 1 auto}
.now .lr.sent .lr-side{flex:none;justify-content:flex-end}
.lr-txt strong{font-weight:700}
.lr-txt .meta{margin-left:8px;font-size:14px;color:var(--sub)}
.lr-side{display:flex;flex:none;align-items:center;gap:16px}
.lr-side time,.lr-side .dt{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.lr-side time{min-width:96px;text-align:right}
.lr-side .btn{min-width:0}
.lr .btn.sm{padding:0 16px}
.picked{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:9999px;background:#fff;box-shadow:inset 0 0 0 1px var(--g200);font-size:14px;font-weight:600;white-space:nowrap}
.lnk{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;border:0;background:none;font:600 16px Pretendard,sans-serif;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* 강조 하늘 판 — 지금: 안쪽 40 / 바꾼 뒤: 32 (줄 안쪽과 같은 정렬선) */
.feat{position:relative;margin-top:48px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px;padding:32px;border:1px solid var(--tl);border-radius:24px;background:var(--fx-accent);box-shadow:var(--sh-accent)}
.now .feat{padding:40px}
.feat .peek{position:absolute;right:32px;top:-48px;width:96px;height:96px;object-fit:contain;pointer-events:none}
.now .feat .peek{right:40px}
.feat .eb{font-size:14px;font-weight:700;color:var(--sub)}
.feat h2{margin-top:4px;font:700 24px/1.4 Pretendard,sans-serif;letter-spacing:0;overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:12px;margin-top:16px}
.who span{font-size:14px;color:var(--sub)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--tl)}
.facts dt{font-size:14px;font-weight:500;color:var(--sub)}
.facts dd{margin:4px 0 0;font-weight:600}
.acts{display:flex;gap:12px;margin-top:32px}
.acts .btn{min-width:160px}
.due{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:4px;text-align:right}
.due .t{font-size:14px;color:var(--sub)}
.due .big{margin:0;font:800 48px/1.2 Tmoney,sans-serif;letter-spacing:-1.5px;color:var(--alert-800,#92400e)}
.due .big small{margin-left:0;font:600 16px Pretendard,sans-serif;letter-spacing:0;color:#92400e}

/* 남은 승인 요청 카드 2열 */
.acards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.acard{display:flex;flex-direction:column;gap:16px;padding:24px;min-width:0}
.atop{display:flex;align-items:center;gap:12px}
.atop strong{display:block;overflow-wrap:anywhere}
.atop span.s{display:block;font-size:14px;color:var(--sub)}
.afoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--g200);font-size:14px;color:var(--sub)}

/* 받은 선물 */
.side2{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:32px;align-items:start;margin-top:32px}
.main{min-width:0}
.mhead{display:flex;align-items:baseline;gap:12px;height:32px}
.mhead h2,.qm h3{font:800 24px/1.3 Tmoney,sans-serif;letter-spacing:0}
.mhead small,.qm small{font-size:14px;color:var(--sub)}
.main>.month+.month{margin-top:48px}
.bcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.bcard{display:flex;flex-direction:column;gap:16px;min-width:0;padding:24px}
.bcard.open{grid-column:1/-1}
.btop{display:flex;align-items:center;gap:12px}
.btop strong{display:block}.btop span.s{display:block;font-size:14px;color:var(--sub)}
.quote{padding:12px 16px;border-radius:12px;background:linear-gradient(180deg,#f9f9fa,#f4f5f7);box-shadow:inset 0 0 0 1px var(--g200);font-size:14px}
.now .quote{box-shadow:inset 0 1px 0 rgb(255 255 255/.9)}
.quote b{display:block;font-weight:600}.quote span{color:var(--sub)}
.bfoot{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:auto;font-size:14px;color:var(--sub)}
.now .bfoot{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bside{position:relative;margin-top:48px;padding:40px 24px 24px;border-radius:24px}
.bside img{position:absolute;right:24px;top:-40px;width:80px;height:80px;object-fit:contain}
.bside .num48 small{font-size:16px}
.bside p.n{margin-top:8px;font-size:14px;color:var(--sub)}
.rform{padding-top:16px;border-top:1px solid var(--g200)}
.rform h3{font:700 16px/1.6 Pretendard,sans-serif;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--g500)}
.now .chip{min-height:48px;box-shadow:inset 0 0 0 1px var(--g200)}
.chip::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--g500);background:#fff}
.chip.on{background:var(--p50);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.chip.on::before{box-shadow:inset 0 0 0 2px var(--ink);background:radial-gradient(circle,var(--ink) 0 5px,#fff 6px)}
.fld{margin-top:16px}
.fld .l{display:flex;justify-content:space-between;font-weight:700}
.fld .l small{font-weight:500;color:var(--sub)}
.fld .in{display:flex;align-items:center;min-height:52px;margin-top:8px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--g500);color:var(--sub)}

/* 열람 기록 */

.stage{container:st/inline-size;--primary:#89CFF0;--p50:#E0F2FE;--tint:#F0F8FF;--tl:#BFE3F7;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g500:#6B7280;--sub:#4B5563;--ink:#1F2937;

  --sh-accent:inset 0 1px 0 rgb(255 255 255/.8),0 8px 24px rgb(137 207 240/.18);
  --fx-card:radial-gradient(90% 120% at 100% 0%,rgb(137 207 240/.07) 0%,rgb(137 207 240/0) 55%),linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
  --sh-card:inset 0 1px 0 #fff,0 1px 2px rgb(31 41 55/.04),0 4px 12px rgb(31 41 55/.04);
  --hair:inset 0 0 0 1px var(--g200);
  --fx-btn:linear-gradient(180deg,#95d4f2 0%,#89cff0 100%);
  background:#fff;position:relative;font-size:16px;line-height:1.6;color:var(--ink)}
.stage a{color:inherit;text-decoration:none}
.stage h1,.stage h2,.stage h3{font-family:Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;font-weight:800;line-height:1.3;color:var(--ink)}
.stage svg{flex:none}
.app{display:flex;min-height:900px}
.sb{flex:none;width:240px;background:var(--tint);border-right:1px solid var(--g200);display:flex;flex-direction:column;padding:0 8px 8px}
.sb-top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 8px}
.sb-top .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.logo img{width:28px;height:28px;border-radius:22%}
.sb nav{flex:1}
.sb nav a{display:flex;align-items:center;gap:12px;height:36px;margin-bottom:2px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500}
.sb nav a[aria-current]{background:var(--p50);font-weight:600}
.sb nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb nav .n{margin-left:auto;display:grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--primary);font-size:14px;font-weight:700;line-height:1}
.sb .me{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;font-size:14px;font-weight:600;border-top:1px solid var(--g200)}
.me i{width:28px;height:28px;border-radius:50%;background:var(--p50)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{display:none;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid var(--g200);background:#fff}
.tb .logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif}
.tb button{width:44px;height:44px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pane-main{flex:1;width:100%;padding:40px;min-width:0;container:pane/inline-size}
.col{max-width:880px;margin-inline:auto}
.col.w1040{max-width:1040px}
.ft{background:var(--g50);padding:40px 0;font-size:14px;color:var(--sub)}
.ft .in{max-width:928px;margin:0 auto;padding:0 24px}
.ft .r1,.ft .r2{display:flex;flex-wrap:wrap;gap:0 24px;justify-content:space-between}
.ft a{display:inline-flex;align-items:center;min-height:44px}
.ft .biz{margin-top:8px;line-height:1.7}

/* 페이지 머리 — 지금: 제목 24 / 바꾼 뒤: 제목 32 (휴대폰 24) */
.ph{margin-bottom:32px}
.phrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.ph h1{font-size:32px;line-height:1.3}
.now .ph h1{font-size:24px}
.cnt{margin-left:8px;font:400 16px Pretendard;color:var(--g500);letter-spacing:0}
.phd{margin-top:8px;max-width:680px;color:var(--sub);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;min-width:96px;border:0;border-radius:12px;background:var(--fx-btn);color:var(--ink);font:600 16px/1.4 Pretendard,sans-serif;white-space:nowrap;box-shadow:inset 0 1px 0 rgb(255 255 255/.45),0 1px 2px rgb(31 41 55/.06)}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--g500)}
.now .btn.line{box-shadow:inset 0 0 0 1px var(--g400)}
.btn.sm{min-height:44px;min-width:0}
/* 글자 버튼(base.css .btn--text) — 테두리·면 없이 보조 글자색, 눌림 칸 44 유지. 2026-11-02 사용자 「테두리 없는 버튼」 */
.btn.text{background:none;box-shadow:none;color:var(--sub);font-weight:500;padding:0 8px}
.btn.text:hover{background:var(--g100)}
.lr .btn.text.sm{margin-block:-8px}
.btn.block{width:100%}

/* 상태 뱃지 — 지금: 글자만(400) / 바꾼 뒤: 점 + 글자(700), 팬 홈 .stt 와 같은 모양 (35절) */
.tg{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:4px 12px;border-radius:9999px;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.tg::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.tg.warn{background:var(--warn-soft);color:var(--warn)}
.tg.succ{background:var(--succ-soft);color:var(--succ)}
.tg.danger{background:var(--danger-soft);color:var(--danger)}
.tg.white{background:#fff}
.tg.white.warn{background:var(--warn-soft)}
.tg.nodot::before{display:none}
.now .tg{min-height:0;gap:0;font-weight:400;line-height:1.6}
.now .tg::before{display:none}
.tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.now .tg.keep-icon{gap:8px}

/* 탭 — 지금: 밑줄 하늘 2px(1.8:1) / 바꾼 뒤: 44 높이, 고른 탭 --primary-50 면 + 밑줄 2px --brand-line */
.tabs{display:flex;gap:8px;margin:0 0 24px;box-shadow:inset 0 -1px 0 var(--g200)}
.tabs span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;color:var(--sub);font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.tabs span[aria-selected=true]{background:var(--p50);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.now .tabs{gap:24px}
.now .tabs span{padding:0;min-height:44px;font-weight:400;color:var(--sub)}
.now .tabs span[aria-selected=true]{background:none;font-weight:700;color:var(--ink);box-shadow:inset 0 -2px 0 var(--primary)}

/* 강조 칸(feat) · 촘촘한 줄(lrow) — 바뀌지 않음 */
.feat{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px 32px;align-items:center;padding:32px;border:1px solid var(--tl);border-radius:24px;background:var(--fx-accent);box-shadow:var(--sh-accent)}
.feat-who{display:flex;gap:16px;align-items:center;min-width:0}
.feat-who .face{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--tl);background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.feat-who .face img{width:40px;height:40px;object-fit:contain}
.feat-who strong{display:block;font-size:20px;line-height:1.6}
.meta{font-size:14px;color:var(--sub)}
.feat-who .meta{display:block}
.feat-who .tg{margin-top:8px}
.feat-days{text-align:right;line-height:1.2}
.big{font:800 48px/1.2 Tmoney,sans-serif;letter-spacing:-1.5px;color:var(--ink)}
.big small{margin-left:4px;font:600 16px Pretendard;letter-spacing:0;color:var(--sub)}
.big.s32{font-size:32px;letter-spacing:-1px}
.feat-days .lab{display:block;margin-top:4px;font-size:14px;color:var(--sub)}
.lrows{margin-top:24px}
.lrow{position:relative;display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 32px}
.now .lrow{padding:8px 12px}
.lrow+.lrow{border-top:1px solid var(--g200)}
.lrow .face{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--f,#cfe3fa)}
.lrow-txt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow-txt strong{font-weight:700}
.lrow-txt .meta{margin-left:8px}
.lrow-side{display:flex;flex:none;align-items:center;gap:16px}
.chev{width:20px;height:20px;fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 빈 상태 */
.empty{display:grid;justify-items:center;gap:16px;padding:48px 24px;text-align:center;border-radius:16px;background:#fff;box-shadow:var(--hair),0 1px 3px rgb(0 0 0/.06)}
.empty img{width:72px;height:72px;object-fit:contain}
.empty h2{font:800 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.epanel{position:relative;display:flex;align-items:center;gap:32px;margin-top:96px;padding:48px 32px 32px;border-radius:24px;background:var(--fx-accent);box-shadow:var(--sh-accent);border:1px solid var(--tl)}
.now .epanel{border:0}
.epanel img{position:absolute;top:-64px;right:48px;width:160px;height:160px;object-fit:contain}
.epanel p{max-width:480px}

/* 보낸 선물 */
.secH{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px}
.secH h2{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.secH small{font-size:14px;color:var(--sub)}
.ccards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.ccard,.gcard{position:relative;min-width:0;padding:24px;border-radius:16px;background:var(--fx-card);box-shadow:var(--hair),var(--sh-card)}
.ccard{display:flex;flex-direction:column;gap:16px}
.cwho{display:flex;align-items:center;gap:12px;min-width:0}
.cface{flex:none;width:56px;height:56px;border-radius:50%;background:var(--p50);overflow:hidden;display:grid;place-items:center}
.cface img{width:44px;height:44px;object-fit:contain}
.cname strong{display:block;font-size:20px;line-height:1.4}
.cname small{display:block;font-size:14px;color:var(--sub)}
.last{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--g200)}
.lab2{font-size:14px;color:var(--sub)}
.cline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.mini{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.mini .segs{display:inline-flex;gap:4px}
.mini i{display:block;width:12px;height:4px;border-radius:9999px;background:var(--g200)}
.mini i.on{background:#7cc6ea}
.more{margin-top:auto;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.giftTabs{margin-top:48px}
.subH{margin-top:32px;font:700 16px/1.6 Pretendard,sans-serif;letter-spacing:0}
.subH small{margin-left:8px;font-size:14px;font-weight:500;color:var(--sub)}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.gcard{display:flex;flex-direction:column;gap:16px}
.gcard.hi{border:0;background:var(--fx-accent);box-shadow:inset 0 0 0 1px var(--tl),var(--sh-accent)}
.gtop{display:flex;align-items:center;gap:12px}
.gtop .face{flex:none;width:32px;height:32px;border-radius:50%;background:var(--p50);display:grid;place-items:center;overflow:hidden}
.gtop .face img{width:24px;height:24px;object-fit:contain}
.gtop .who{flex:1;min-width:0;font-weight:700}
.gcard h3{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.gcard .what{margin-top:4px;font-size:14px;color:var(--sub)}
.pbar{display:flex;gap:4px}
.pbar i{flex:1;height:8px;border-radius:9999px;background:var(--g200)}
.pbar i.on{background:linear-gradient(180deg,#9ad6f3 0%,#7cc6ea 100%)}
.hi .pbar i:not(.on){background:#fff}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--sub)}
.pfoot b{color:var(--ink);font-weight:600}
.stop{display:flex;align-items:center;min-height:48px;padding-top:16px;border-top:1px solid var(--g200);font-size:14px;color:var(--sub)}
.todoline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding-top:16px;border-top:1px solid var(--tl);font-size:14px;font-weight:600}

/* 선물 상세 */
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--sub);font-size:14px;font-weight:400}
.top2>*+*{margin-top:24px}
.tbox{position:relative;padding:24px 32px;border:1px solid var(--tl);border-radius:24px;background:var(--fx-accent);box-shadow:var(--sh-accent)}
.eyebrow{font-size:14px;font-weight:700;color:var(--sub)}
.tbox h2{margin-top:8px;font:800 20px/1.4 Tmoney,Pretendard,sans-serif;letter-spacing:-.6px}
.tsub{margin-top:4px;font-size:14px;color:var(--sub)}
.finder{margin-top:16px;padding:24px;max-width:528px;border-radius:16px;background:rgb(255 255 255/.85);border:1px solid var(--tl)}
.now .finder{border-color:transparent;max-width:none}
.finder.gray{margin-top:12px;background:var(--g50);border-color:transparent;box-shadow:var(--hair)}
.now .finder.gray{box-shadow:none}
.finder .in{display:grid;gap:16px;max-width:480px}
.now .finder .in{max-width:none}
.finder label{display:block;margin-bottom:8px;font-weight:700}
.input{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--g500);font-weight:400;color:var(--g500)}
.input.sel{color:var(--ink)}
.alt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--tl)}
.textlink{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--sub);text-decoration:underline;text-underline-offset:4px}
.dhero{position:relative;padding:32px;border:1px solid var(--tl);border-radius:24px;background:var(--fx-accent);box-shadow:var(--sh-accent)}
.peek{position:absolute;top:-40px;right:32px;width:96px;height:96px;object-fit:contain}
.dhero .meta{padding-right:112px}
.dhero h1{margin-top:4px;padding-right:112px;font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.dhero .what{font-size:14px;color:var(--sub)}
.dnow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px;margin-top:24px}
.dnow .big{margin-top:8px}
.msg{font-weight:600}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:24px}
.steps>li{min-width:0;font-size:14px;color:var(--sub)}
.steps>li::before{content:"";display:block;height:8px;margin-bottom:8px;border-radius:9999px;background:#fff}
.steps>li.done{color:var(--ink)}
.steps>li.done::before{background:linear-gradient(180deg,#9ad6f3 0%,#7cc6ea 100%)}
.steps>li.next{color:var(--ink);font-weight:700}
.steps>li.next::before{box-shadow:inset 0 0 0 2px var(--primary)}
.steps small{display:block;font-size:14px;font-weight:400;color:var(--sub)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;margin-top:24px}
.dgrid.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.dcard{min-width:0;padding:24px;border-radius:16px;background:var(--fx-card);box-shadow:var(--hair),var(--sh-card)}
.ctitle{font:700 16px/1.6 Pretendard,sans-serif;letter-spacing:0}
.boxline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0}
.boxline h3{font:700 16px/1.6 Pretendard,sans-serif;letter-spacing:0}
.boxline h3 span{font-weight:400;color:var(--sub)}
.fold{border-top:1px solid var(--g200)}
.fold+.fold{margin-top:0}
.fold summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:14px;font-weight:600;list-style:none}
.fold summary::after{content:"+";font-size:20px;color:var(--sub)}
.addr3+.fold{margin-top:16px}
.fold[open] summary::after{transform:rotate(45deg)}
.fold .inb{padding:8px 0 16px}
.fold .inb>*+*{margin-top:12px}
.fold .hint{font-size:16px;color:var(--sub)}
.fold .hint.s{font-size:14px}
.wb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:480px}
.wb .input,.wb .btn{height:48px}
.now .wb{max-width:none}
.now .wb .input,.now .wb .btn{height:52px}
.wblab{display:block;margin-bottom:8px;font-weight:700}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.now .sronly{position:static;width:auto;height:auto;overflow:visible;clip:auto}
.addr3{padding:24px;border-radius:16px;background:var(--fx-accent);box-shadow:inset 0 1px 0 rgb(255 255 255/.8);margin-top:8px}
.codebox{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 16px}
.codelab{grid-column:1/-1;font-size:14px;font-weight:700}
.code6{display:flex;gap:4px;min-width:0}
.code6 span{display:grid;place-items:center;width:44px;height:56px;border:1px solid var(--ink);border-radius:12px;background:#fff;font:800 24px/1 Tmoney,sans-serif;color:var(--sub)}
.addr3 dl{display:grid;gap:8px;margin:16px 0 0;padding-top:16px;border-top:1px solid var(--tl);font-size:14px}
.addr3 dl>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
.addr3 dt{color:var(--sub)}.addr3 dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.tail{display:inline-block;padding:0 4px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);font-weight:700;letter-spacing:1px}
.acts{margin-top:16px}
.pts{display:grid;gap:4px;margin:12px 0 0;padding:0;list-style:none;font-size:14px;color:var(--sub)}
.pts li{position:relative;padding-left:14px}.pts li::before{content:"";position:absolute;left:2px;top:.65em;width:4px;height:4px;border-radius:9999px;background:currentColor}
.sec2{margin-top:32px;padding-top:32px;border-top:1px solid var(--g200)}
.sec2 h2{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.sec2 p{margin-top:8px;color:var(--sub)}
.now .fold{margin-top:16px}
.kv{margin:12px 0 0;font-size:14px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.kv>div+div{margin-top:8px}
.kv dt{flex:none;white-space:nowrap;font-weight:400;color:var(--sub)}
.kv dd{min-width:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv dd.plain{font-weight:400}
.grp{margin-top:16px;padding-top:16px;border-top:1px solid var(--g200)}
.grp h3{font:700 14px/1.5 Pretendard,sans-serif;letter-spacing:0;color:var(--sub)}
.paytot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g200)}
.paytot span{font-size:14px;font-weight:700}
.paytot b{font:800 24px/1.2 Tmoney,sans-serif;font-variant-numeric:tabular-nums}
.paytot small{margin-left:2px;font:600 14px Pretendard}
.tagline{margin-top:12px}
.note{margin-top:12px;font-size:14px;color:var(--sub)}
.cancel{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-size:14px;color:var(--sub);text-decoration:underline;text-underline-offset:4px}
.bottomlink{margin-top:32px}
/* 거절·기한 지남 — 「이 선물은 발송하지 마세요」: 지금 = 위 1px 선 아래 글자 / 바꾼 뒤 = 흰 상자 + 「!」 원, 선물 정보와 같은 높이 줄에 */
.sec{margin-top:32px;padding-top:32px;border-top:1px solid var(--g200)}
.sec h2{font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.sec p{margin-top:8px;color:var(--sub)}
.sec p+p{margin-top:8px}
.warnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:24px}
.sec.warnbox{margin-top:0;padding:24px;border-top:0;}
.warnbox{padding:24px;border-radius:16px;background:var(--fx-card);box-shadow:var(--hair),var(--sh-card)}
.warnbox h2{display:flex;align-items:flex-start;gap:12px;font:700 20px/1.4 Pretendard,sans-serif;letter-spacing:0}
.warnbox h2::before{content:"!";flex:none;display:grid;place-items:center;width:24px;height:24px;margin-top:2px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink);font-size:14px;font-weight:700;line-height:1}
.warnbox p{margin-top:8px;color:var(--sub)}
.now .warnrow{display:block;margin-top:0}
.now .sec.warnbox{padding:32px 0 0;border-top:1px solid var(--g200);border-radius:0;background:none;box-shadow:none;margin-top:32px}

<div class="who">${FC()}<span>11월 1일 09:20 요청 · 지난 선물 2건 · 모두 검수 통과</span></div>
<dl class="facts"><div><dt>선물 종류</dt><dd>인형·쿠션</dd></div><div><dt>상자</dt><dd>2개</dd></div><div><dt>전자기기·금속</dt><dd>없음</dd></div></dl>
<div class="acts">${btn('받지 않기','line')}${btn('승인하기','')}</div></div>
<div class="due"><span class="t">승인 기한</span><p class="big">1일 <small>남음</small></p><span class="t">11월 2일 18:00까지</span></div></section>`;
const acard=(n,k,box,foot)=>`<li class="card acard"><div class="atop">${FC('md')}<div><strong>${n}님의 선물 승인 요청</strong><span class="s">${k} · 상자 ${box}개</span></div></div><div class="afoot"><span>${foot}</span>${btn('승인하기')}</div></li>`;
const A_CHECK=row('다온님 선물 · 추적 장치 발견','추적 장치 발견 · 2일 남음 · 인형·쿠션 · 상자 2개 중 1번',btn('신고할지 정하기'))
 +row('모모님 선물 · 블루투스 기기 발견','기기 발견 · 오늘까지 · 전자기기 · 상자 1개 · 추적 장치 아님',`<span class="picked">받기 선택</span><button type="button" class="lnk">선택 취소</button>`);
const A_SENT=row('하늘님께 보낸 역조공','반송 주소 확인 · 11월 8일까지 미확인 시 처분 대상',btn('확인하기'))
 +row('유나님께 보낸 선물 · 상자 1','반송 주소 확인 · 11월 8일까지 미확인 시 처분 대상',btn('확인하기'))
 +row('새벽달님께 보낸 상자 미도착','미도착 상자 · 10월 30일 결제 완료',btn('내 상자 찾기'))
 +row('이안님께 보낼 선물','결제 대기 · 3일 남음 · 6,900원',btn('결제하기'))
 +row('이안님께 보낸 선물 · 상자 1','추가 결제 · 오늘까지 · 2,000원',btn('추가 결제'))
 +row('서현님께 보낸 선물 · 상자 2','미도착 상자 · 5일 남음 · 소형 상자',btn('상자 찾기'));
const actions=k=>{
  if(k==='empty')return shell(head('지금 할 일')+`<div style="margin-top:48px">${empty('',{c:'nocard',img:'assets/icon-approve.webp',h:'현재 처리할 일이 없습니다',btn:btn('홈으로','line')})}</div>`,'지금 할 일',0);
  if(k==='one')return shell(head('지금 할 일','1건')+hero(),'지금 할 일',1);
  return shell(head('지금 할 일','12건')
   +`<section class="sec" aria-labelledby="ca-in"><div class="sech"><h2 id="ca-in">받은 선물<small>2건</small></h2></div><ul class="rows">${A_CHECK}</ul></section>`
   +hero()
   +`<section class="sec" aria-labelledby="ca-more"><div class="sech"><h2 id="ca-more">남은 승인 요청<small>3건</small></h2></div><ul class="acards">${acard('달토끼','의류',1,'11월 5일까지')}${acard('솜사탕','꽃',1,'11월 4일까지')}${acard('구름빵','문구',2,'11월 4일까지')}</ul></section>`
   +`<section class="sec" aria-labelledby="ca-out"><div class="sech"><h2 id="ca-out">보낸 선물<small>6건</small></h2></div><ul class="rows">${A_SENT}</ul></section>`,'지금 할 일',12);
};

/* ---------- 2 받은 선물 ---------- */
const bc=(n,txt,foot,act,quote,extra)=>`<li class="card bcard ${extra||''}"><div class="btop">${FC('lg')}<div><strong>${n}님의 선물</strong><span class="s">${txt}</span></div></div>${quote?`<div class="quote"><b>${quote[0]}</b>${quote[1]?`<span>${quote[1]}</span>`:''}</div>`:''}<div class="bfoot"><span>${foot}</span>${act||''}</div></li>`;
const bside=n=>`<aside class="bside gc" aria-labelledby="pend-h"><img src="assets/mascot-gift.png" alt=""><h2 class="lab" id="pend-h">답장하지 않은 선물</h2><p class="num48">${n}<small>개</small></p><p class="n">답장은 선택 사항이며, 이 숫자는 본인에게만 표시됩니다.</p></aside>`;
const dr=(n,txt,foot,act)=>`<li class="lr"><span class="fc">${`<img src="${CAT}" alt="">`}</span><p class="lr-txt"><strong>${n}님의 선물</strong><span class="meta">${txt}</span></p><div class="lr-side"><span class="dt">${foot}</span>${act||''}</div></li>`;
const rform=()=>`<form class="rform" aria-labelledby="rf"><h3 id="rf">다온님께 답장</h3><div class="chips" role="radiogroup" aria-label="짧은 답장 고르기">${['잘 받았어요, 고마워요','너무 마음에 들어요','잘 쓸게요','덕분에 힘이 났어요','정성이 느껴져서 감동이에요'].map((t,i)=>`<span class="chip ${i===1?'on':''}" role="radio" aria-checked="${i===1}">${t}</span>`).join('')}</div>
<div class="fld"><div class="l">한 줄 더 쓰기 <small>(선택)</small></div><div class="in">예: 손편지 읽고 한참 웃었어요</div><p class="ct">0 / 40</p></div>
<div class="fold2">답장 공개 범위</div><div class="fbtns">${btn('답장 보내기','')}${btn('답장 없이 확인만','line')}</div></form>`;
const bopen=()=>`<li class="card bcard open"><div class="btop">${FC('lg')}<div><strong>다온님의 선물</strong><span class="s">인형·쿠션 · 상자 2개 중 1번째</span></div></div>${rform()}</li>`;
const boxes=k=>{
  const h=head('받은 선물',k==='empty'?'0개':'7개');
  if(k==='empty')return shell(h+`<div class="side2"><div class="main"><div style="margin-top:48px">${empty('출고된 선물이 없습니다. 팬꾹에서 출고하면 상자별로 표시됩니다.',{c:'one'})}</div></div>${bside(0)}</div>`,'받은 선물');
  const cards=k==='reply'
   ?bopen()
    +bc('다온','인형·쿠션 · 상자 2개 중 2번째','11월 1일 출고',btn('받았어요'))
    +bc('하늘','꽃 · 상자 1개','11월 1일 출고 · 수령 확인',btn('답장 남기기'))
   :bc('다온','인형·쿠션 · 상자 2개 중 1번째','11월 1일 출고',btn('받았어요'))
    +bc('다온','인형·쿠션 · 상자 2개 중 2번째','11월 1일 출고',btn('받았어요'))
    +bc('하늘','꽃 · 상자 1개','11월 1일 출고 · 수령 확인',btn('답장 남기기'))
    +bc('별빛','의류 · 상자 1개','11월 1일 출고 · 11월 1일 답장','<button type="button" class="lnk">답장 삭제</button>',['너무 마음에 들어요','곧 방송에서 입을게요']);
  const n=k==='reply'?3:4;
  return shell(h+`<div class="side2"><div class="main"><section class="month" aria-labelledby="bm1"><div class="mhead"><h2 id="bm1">11월</h2><small>${n}개</small></div><ul class="bcards">${cards}</ul></section>
<section class="month" aria-labelledby="bm2"><div class="mhead"><h2 id="bm2">10월</h2><small>3개</small></div><ul class="rows">${dr('솜사탕','의류 · 상자 1개','10월 29일 출고 · 「너무 마음에 들어요」 답장','<button type="button" class="lnk">답장 삭제</button>')}${dr('구름빵','문구 · 상자 1개','10월 28일 출고 · 답장 삭제')}${dr('달토끼','꽃 · 상자 1개','10월 25일 출고',btn('받았어요'))}</ul></section></div>${bside(k==='reply'?4:5)}</div>`,'받은 선물');
};

/* ---------- 3 승인 내역 ---------- */
const TAGS={승인:'succ','기한 만료':'warn',거절:'danger',차단:'danger'};
const rr=(n,k,box,no,t,d)=>`<li class="lr">${FC()}<p class="lr-txt"><strong>${n}님의 선물</strong><span class="meta">${k} · 상자 ${box}개 · ${no}</span></p><div class="lr-side">${tg(t,TAGS[t])}<time>${d}</time></div></li>`;
const qtop=(c,o)=>`<div class="qtop"><div class="card tot"><img src="assets/icon-inspect.webp" alt=""><h2 class="lab" id="done-h">처리한 요청</h2><p class="num48">${c}<small>건</small></p>${o.latest?`<p class="line">최근 처리일 ${o.latest}</p>`:''}</div><dl class="qgrid" aria-label="결과별 건수">${o.g.map(([a,b])=>`<div class="gc"><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl></div>`;
const requests=k=>{
  if(k==='empty')return shell(head('승인 내역','0건')+qtop(0,{g:[['승인',0],['거절',0],['기한 만료',0],['차단',0]]})+`<div style="margin-top:32px">${empty('처리한 요청이 없습니다.',{c:'one'})}</div>`,'승인 내역');
  if(k==='list')return shell(head('승인 내역','5건')+qtop(5,{latest:'10월 15일 (목)',g:[['승인',2],['거절',0],['기한 만료',3],['차단',0]]})
   +`<div class="qm"><h3>10월</h3><small>4건</small></div><ul class="rows">${rr('별빛','응원 슬로건','1','FC-P4X7N','기한 만료','10월 15일')}${rr('달토끼','게임 패드와 간식','2','FC-L5T6B','기한 만료','10월 15일')}${rr('구름빵','꽃다발 모양 비누','1','FC-Z9C3V','기한 만료','10월 15일')}${rr('별빛','손뜨개 인형과 편지','1','FC-7K3M9','승인','10월 1일')}</ul>
<div class="qm"><h3>9월</h3><small>1건</small></div><ul class="rows">${rr('솜사탕','엽서','1','FC-A1B2C','승인','9월 25일')}</ul>
<div class="fold3"><div class="h">승인 기한 만료</div></div>`,'승인 내역');
  return shell(head('승인 내역','9건')+qtop(9,{latest:'11월 1일 (일)',g:[['승인',4],['거절',2],['기한 만료',2],['차단',1]]})
   +`<div class="qm"><h3>11월</h3><small>3건</small></div><ul class="rows">${rr('다온','인형·쿠션','2','FC-Q8W2E','승인','11월 1일')}${rr('모모','엽서','1','FC-R4T7Y','거절','11월 1일')}${rr('하늘','꽃','1','FC-U1I9O','승인','11월 1일')}</ul>
<div class="qm"><h3>10월</h3><small>5건</small></div><ul class="rows">${rr('별빛','응원 슬로건','1','FC-P4X7N','기한 만료','10월 15일')}${rr('달토끼','게임 패드와 간식','2','FC-L5T6B','기한 만료','10월 15일')}${rr('구름빵','꽃다발 모양 비누','1','FC-Z9C3V','거절','10월 12일')}${rr('유나','문구 세트','1','FC-M3N5B','차단','10월 9일')}${rr('별빛','손뜨개 인형과 편지','1','FC-7K3M9','승인','10월 1일')}</ul>
<div class="qm"><h3>9월</h3><small>1건</small></div><ul class="rows">${rr('솜사탕','엽서','1','FC-A1B2C','승인','9월 25일')}</ul>
<div class="fold3 open"><div class="h">승인 기한 만료</div><p>7일 이내에 승인 여부를 선택하지 않아 자동으로 거절 처리되었습니다.</p></div><div class="fold3 open"><div class="h">팬 차단</div><p>차단한 팬은 새 선물을 등록할 수 없습니다. 차단 해제는 <u>상세 설정 &gt; 주소와 설정 &gt; 차단한 팬</u>에서 할 수 있습니다.</p></div>`,'승인 내역');
};

/* ---------- 4 선물 현황 ---------- */
const gcard=(n,name,what,cells,label,late,act)=>`<li class="${act?'gcard hi':'card gcard'}"><div class="gtop">${FC()}<strong>${n}님</strong></div><div><h3 class="gname">${name}</h3><p class="gwhat">${what}</p></div><div>${bar(cells,'pbar')}<p class="pfoot"><b class="${late?'late':''}">${label}</b><span aria-hidden="true">${cells}/5</span></p></div>${act?`<div class="cardact">${btn('지금 할 일')}</div>`:''}</li>`;
const sech=(id,t,n,link)=>`<div class="sech"><h2 id="${id}">${t}<small>${n}건</small></h2><a href="#">${link}</a></div>`;
const pwait=()=>`<section class="pfeat" aria-labelledby="gp-wait"><img class="peek" src="assets/icon-approve.webp" alt=""><div><p class="num48">2<small>건</small></p><span class="lab" style="font-weight:500">승인 대기</span></div><div class="mid"><h2 id="gp-wait">승인 대기 선물</h2><p>가장 빠른 승인 기한: <span class="soon">1일 남음</span> · 별빛님의 선물</p><span class="pfaces" aria-hidden="true">${FC()}${FC()}</span></div>${btn('지금 할 일','')}</section>`;
const NONE=txt=>`<div style="margin-top:16px">${empty(txt,{c:'plain'})}</div>`;
const g1=gcard('별빛','손뜨개 인형과 편지','상자 1개 · 10월 1일 승인',4,'배송 중',0,0);
const progress=k=>{
  const n={receiving:1,waiting:3,sending:7}[k];
  const inSec=`<section class="sec" aria-labelledby="gp-in">${sech('gp-in','받는 선물',k==='sending'?2:1,'받은 선물 전체 ›')}`
   +(k==='sending'?`<ul class="gcards" aria-label="받는 선물">${gcard('다온','인형·쿠션 선물 세트','상자 2개 · 10월 28일 승인',3,'검수 중',0,0)}${gcard('모모','블루투스 이어폰','상자 1개 · 10월 30일 승인',3,'검수 완료',1,1)}</ul>`:`<ul class="gcards" aria-label="받는 선물">${g1}</ul>`)+`</section>`;
  const outSec=`<section class="sec" aria-labelledby="gp-out">${sech('gp-out','보내는 선물',k==='sending'?5:0,'보낸 내역 전체 ›')}`
   +(k==='sending'?`<p class="ghead">11월 1일 14:20 결제 완료<span> · 팬 3명</span></p><ul class="rows">${
     row('별빛님','소형 상자',`${mini(1,'수락 대기')}`,1,'sent')
    +row('하늘님','중형 상자',`${mini(2,'팬꾹 도착 대기')}${btn('내 상자 찾기')}`,1,'sent')
    +row('구름빵님','소형 상자',`${mini(3,'검수 중')}`,1,'sent')}</ul>
<p class="ghead">10월 24일 11:32 결제 완료<span> · 팬 2명</span></p><ul class="rows">${
     row('달토끼님','소형 상자',`${mini(2,'미도착',1)}${btn('배송 조회')}${btn('내 상자 찾기')}${btn('지금 할 일')}`,1,'sent')
    +row('솜사탕님','소형 상자',`${mini(4,'배송 중')}`,1,'sent')}</ul>`:NONE('진행 중인 선물이 없습니다.'))+`</section>`;
  const inner=k==='waiting'?head('선물 현황','· 진행 중 3건')+pwait()+inSec+outSec:k==='sending'?head('선물 현황','· 진행 중 7건')+inSec+outSec:head('선물 현황','· 진행 중 1건')+inSec+outSec;
  return shell(inner,'선물 현황',k==='waiting'?2:k==='sending'?1:0);
};
/* ---------- 승인 취소 장면 ---------- */
const CANCEL_BTN=n=>`<button type="button" class="btn text sm cbtn" aria-label="${n}님 선물 승인 취소"><svg class="ci" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>승인 취소</span></button>`;
const rr2=(n,k,box,no,t,d,cancel)=>`<li class="lr">${FC()}<p class="lr-txt"><strong>${n}님의 선물</strong><span class="meta">${k} · 상자 ${box}개 · ${no}</span></p><div class="lr-side">${tg(t,TAGS[t])}<time>${d}</time><span class="slot">${cancel?CANCEL_BTN(n):''}</span></div></li>`;
const requestsCancel=()=>shell(head('승인 내역','7건')+qtop(7,{latest:'11월 1일 (일)',g:[['승인',4],['거절',2],['기한 만료',1],['차단',0]]})
 +`<div class="qm"><h3>11월</h3><small>4건</small></div><ul class="rows">${rr2('다온','인형·쿠션','2','FC-Q8W2E','승인','11월 1일',1)}${rr2('모모','엽서','1','FC-R4T7Y','거절','11월 1일')}${rr2('하늘','꽃','1','FC-U1I9O','승인','11월 1일')}${rr2('달토끼','문구 세트','1','FC-D6K2P','승인','11월 1일',1)}</ul>
<div class="qm"><h3>10월</h3><small>3건</small></div><ul class="rows">${rr2('별빛','응원 슬로건','1','FC-P4X7N','기한 만료','10월 15일')}${rr2('구름빵','꽃다발 모양 비누','1','FC-Z9C3V','거절','10월 12일')}${rr2('별빛','손뜨개 인형과 편지','1','FC-7K3M9','승인','10월 1일')}</ul>`,'승인 내역');

const gcard2=(n,name,what,cells,label,late,act,cancel)=>`<li class="${act?'gcard hi':'card gcard'}"><div class="gtop">${FC()}<strong>${n}님</strong></div><div><h3 class="gname">${name}</h3><p class="gwhat">${what}</p></div><div>${bar(cells,'pbar')}<p class="pfoot"><b class="${late?'late':''}">${label}</b><span aria-hidden="true">${cells}/5</span></p></div>${(act||cancel)?`<div class="cardact">${cancel?CANCEL_BTN(n):''}${act?btn('지금 할 일'):''}</div>`:''}</li>`;
const progressCancel=()=>shell(head('선물 현황','· 진행 중 4건')
 +`<section class="sec" aria-labelledby="gp-in">${sech('gp-in','받는 선물',4,'받은 선물 전체 ›')}<ul class="gcards" aria-label="받는 선물">${gcard2('다온','인형·쿠션 선물 세트','상자 2개 · 11월 1일 승인',3,'검수 중',0,0,1)}${gcard2('하늘','꽃다발 모양 비누','상자 1개 · 11월 1일 승인',2,'팬꾹 도착 대기',0,0,1)}${gcard2('모모','블루투스 이어폰','상자 1개 · 10월 30일 승인',3,'검수 완료',1,1,1)}${gcard2('별빛','손뜨개 인형과 편지','상자 1개 · 10월 1일 승인',4,'배송 중',0,0,0)}</ul></section>`,'선물 현황',1);

const DLG={
 before:'승인 대기로 돌아갑니다. 11월 5일까지 다시 승인할 수 있습니다.',
 expired:'승인 기한이 지나 다시 승인할 수 없습니다. 취소하면 기한 만료로 반려됩니다.',
 after:'팬꾹에 도착한 상자가 있어 취소하면 거절로 끝나고 상자는 팬에게 반송됩니다. 다시 승인할 수 없습니다.'};
const XI='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m5 5 10 10M15 5 5 15"/></svg>';
let dlgN=0;
const dialog=k=>{const id='dt'+(++dlgN);
 return `<div class="dlgbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${id}"><span class="grip" aria-hidden="true"></span><div class="hd"><h2 id="${id}">승인을 취소할까요?</h2><button type="button" class="x" aria-label="닫기">${XI}</button></div>
<div class="dstack"><div class="dwho"><span class="davatar" aria-hidden="true">다</span><div><b>다온님</b></div></div>
<dl class="dinfo"><div class="dkv"><dt>선물 종류</dt><dd>인형·쿠션</dd></div><div class="dkv"><dt>상자</dt><dd>2개</dd></div><div class="dkv"><dt>주문번호</dt><dd>FC-Q8W2E</dd></div></dl>
${k==='error'?`<p class="derr" role="alert"><span class="mk" aria-hidden="true">!</span>송장이 이미 출력돼 승인을 취소할 수 없습니다. 1:1 문의로 알려 주세요.</p><div class="dbtns"><button type="button" class="btn line">닫기</button></div>`
 :`<p class="dsent">${DLG[k]}</p><div class="dbtns two"><button type="button" class="btn line">닫기</button><button type="button" class="btn">승인 취소</button></div>`}
</div></div></div>`;};

const pair=(label,fn)=>[1440,390].map(w=>`<div class="pane"><h3>${label} <em>${w}</em></h3><div class="shot" style="width:${w}px"><div class="stage" style="width:${w}px">${fn()}</div></div></div>`).join('');
const fanPair=()=>[1440,390].map(w=>`<div class="pane"><h3>팬 선물 상세 · 승인 대기 + 받는 주소 보임 <em>${w}</em></h3><div class="shot" style="width:${w}px"><iframe class="fanf" title="팬 선물 상세 ${w}" style="width:${w}px"></iframe></div></div>`).join('');
const sc=(id,t,cap,body)=>`<section class="scene" aria-labelledby="${id}h" id="${id}"><h2 id="${id}h">${t}</h2><p class="cap">${cap}</p><div class="pairs">${body}</div></section>`;
const dlgs=[['before','3-1 입고 전 · 승인 기한 안 (confirm-before)'],['expired','3-2 입고 전 · 승인 기한 지남 (confirm-expired)'],['after','3-3 입고 뒤 (confirm-after)']];
document.getElementById('root').innerHTML=
 sc('s1','1. 승인 내역 — 「승인 취소」 (cancelable)','「승인」 줄 중 송장이 한 번도 출력되지 않은 줄(다온·달토끼)에만 버튼. 거절·기한 만료 줄과, 송장이 출력된 승인 줄(하늘 · 10월 별빛)에는 없다.',pair('승인 내역',requestsCancel))
 +sc('s2','2. 선물 현황 — 받는 선물 카드의 「승인 취소」','승인된 카드(검수 중 · 팬꾹 도착 대기 · 검수 완료)에 선 버튼. 「지금 할 일」과 같은 줄, 있으면 그 왼쪽. 배송 중(송장 출력 뒤) 카드는 버튼 없음.',pair('선물 현황',progressCancel))
 +sc('s3','3. 확인 창 셋','받지 않기 확인과 같은 창. 휴대폰은 아래에서 올라오는 시트, PC는 가운데 창.',dlgs.map(([k,t])=>`<h3 style="margin:8px 0 0;font:700 16px Pretendard">${t}</h3>`+pair(t.slice(0,3),()=>dialog(k))).join(''))
 +sc('s4','4. 오류 줄 (cancel-error) — 송장이 이미 출력됨','창 아래에 오류 줄. 가능한 동작은 닫기뿐이라 버튼 하나.',pair('오류 줄',()=>dialog('error')))
 +sc('s5','5. 팬 선물 상세 — 입고 전 취소 뒤 「승인 대기」 (받는 주소 보임)','배지 「승인 대기」. 「먼저 보내기」 안내 없이 받는 주소가 그대로 보이고, 송장번호·취소하기는 「보내 주세요」와 같다.',fanPair());
const FAN=document.getElementById('fan-doc').textContent.replace(/<\\\/script>/g,'<'+'/script>');
document.querySelectorAll('iframe.fanf').forEach(f=>{f.srcdoc=FAN});

</script><script>document.querySelectorAll(".vsw button").forEach(b=>b.onclick=()=>{document.body.classList.remove("v-a","v-b","v-c");document.body.classList.add(b.dataset.v);document.querySelectorAll(".vsw button").forEach(x=>x.setAttribute("aria-pressed",x===b))});</script>
</body></html>
