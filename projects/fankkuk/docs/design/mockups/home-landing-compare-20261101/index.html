<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/public/images/logo-mark.png">
  <title>팬꾹 메인 시안 비교</title>
  <!--
  2026-11-01 사용자: 「시안 1,2,3,4 버튼을 클릭해서 비교하면서 볼 수 있게해줘」.
  네 시안을 iframe 으로 미리 다 불러 두고 보이는 것만 바꾼다 — 바꿔도 시안마다 스크롤 위치가 남는다.
  키보드 1~4 로도 바꾼다. 보던 시안·폭은 주소 끝(#3-m 등)에 남아 새로 고쳐도 유지된다.
  -->
  <style>
    @font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Bold.woff') format('woff');font-weight:600 800;font-display:swap}
    @font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Medium.woff') format('woff');font-weight:400 500;font-display:swap}
    :root{--ink:#1F2937;--muted:#55606E;--line:#DCE3EA;--sky:#89CFF0;--sky-100:#E0F2FE;--bg:#E9EEF3}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:500 14px/1.5 Pretendard,system-ui,sans-serif}
    .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .bar h1{margin:0 8px 0 0;font-size:16px;font-weight:800}
    .group{display:flex;gap:4px;padding:4px;border-radius:12px;background:#F1F5F9}
    .group button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;padding:4px 12px;border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);font:600 14px/1.3 Pretendard,sans-serif;text-align:left;cursor:pointer}
    .group button small{font-size:12px;font-weight:500}
    .group button:hover{color:var(--ink);background:#fff}
    /* 지금 보는 시안: 배경색 + 테두리 + 굵기(색만으로 구분하지 않음) */
    .group button[aria-pressed="true"]{background:var(--sky-100);border-color:#7FBFE0;color:var(--ink);font-weight:800}
    .group button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
    .hint{margin-left:auto;font-size:12px;color:var(--muted)}
    .hint a{color:var(--ink);font-weight:700}
    .stage{flex:1;min-height:0;display:flex;justify-content:center;padding:0}
    .stage.m{padding:16px 0}
    iframe{display:none;width:100%;height:100%;border:0;background:#fff}
    iframe.on{display:block}
    .stage.m iframe{width:390px;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.12)}
    @media (max-width:767.98px){.hint{display:none}.width-group{display:none}}
  </style>
</head>
<body>
  <div class="bar">
    <h1>메인 시안 비교</h1>
    <div class="group" role="group" aria-label="시안 고르기">
      <button type="button" data-v="1" aria-pressed="true">시안 1<small>여섯 기능 · 1120</small></button>
      <button type="button" data-v="2" aria-pressed="false">시안 2<small>배포 구조 · 880</small></button>
      <button type="button" data-v="3" aria-pressed="false">시안 3<small>원칙표</small></button>
      <button type="button" data-v="4" aria-pressed="false">시안 4<small>두 프롬프트 합침</small></button>
    </div>
    <div class="group width-group" role="group" aria-label="화면 폭">
      <button type="button" data-w="pc" aria-pressed="true">PC</button>
      <button type="button" data-w="m" aria-pressed="false">휴대폰 390</button>
    </div>
    <p class="hint">키보드 1~4로도 바뀝니다 · <a id="open" href="../home-landing-20261031/" target="_blank" rel="noopener">이 시안만 새 탭으로</a></p>
  </div>
  <div class="stage" id="stage">
    <iframe data-v="1" class="on" src="../home-landing-20261031/" title="시안 1 — 여섯 기능 포함, 폭 1120"></iframe>
    <iframe data-v="2" src="../home-landing-b-20261031/" title="시안 2 — 배포 구조 그대로, 폭 880"></iframe>
    <iframe data-v="3" src="../home-landing-c-20261101/" title="시안 3 — 원칙표 적용"></iframe>
    <iframe data-v="4" src="../home-landing-d-20261101/" title="시안 4 — 두 프롬프트 합침"></iframe>
  </div>
  <script>
    const stage = document.getElementById('stage'), open = document.getElementById('open');
    const frames = [...document.querySelectorAll('iframe')];
    const vBtns = [...document.querySelectorAll('[data-v]')].filter(b => b.tagName === 'BUTTON');
    const wBtns = [...document.querySelectorAll('button[data-w]')];
    let cur = { v: '1', w: 'pc' };
    function apply() {
      vBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cur.v)));
      wBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === cur.w)));
      frames.forEach(f => f.classList.toggle('on', f.dataset.v === cur.v));
      stage.classList.toggle('m', cur.w === 'm');
      open.href = frames.find(f => f.dataset.v === cur.v).getAttribute('src');
      try { history.replaceState(null, '', '#' + cur.v + (cur.w === 'm' ? '-m' : '')); } catch (e) {}
    }
    vBtns.forEach(b => b.addEventListener('click', () => { cur.v = b.dataset.v; apply(); }));
    wBtns.forEach(b => b.addEventListener('click', () => { cur.w = b.dataset.w; apply(); }));
    // 키보드 1~4 — 바깥 페이지와 시안 안 어디에 초점이 있어도
    const onKey = e => { if (/^[1-4]$/.test(e.key) && !e.altKey && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) { cur.v = e.key; apply(); } };
    document.addEventListener('keydown', onKey);
    frames.forEach(f => f.addEventListener('load', () => { try { f.contentDocument.addEventListener('keydown', onKey); } catch (e) {} }));
    const m = location.hash.match(/^#([1-4])(-m)?$/);
    if (m) { cur.v = m[1]; cur.w = m[2] ? 'm' : 'pc'; }
    apply();
  </script>
</body>
</html>
