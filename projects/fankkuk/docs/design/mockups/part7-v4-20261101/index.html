<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬꾹 7파트 안내·정책 화면 · 시안 4 기준으로 맞춘 비교</title>
<!--
  2026-11-01 요청: 7파트 안내·정책 화면 13개를 시안 4 설계 기준(design-prompt.md)으로 다시 맞춘 비교. 5파트(part5-v4-20261101)와 같은 형식.
  문구·칸 순서·노출 조건·약관 본문은 지금 코드 그대로(한 글자도 바꾸지 않음). 시안에 없던 안내 문장은 덧붙이지 않았다. 기능 추가 없음.
  탭 다섯: 소개 / 문서형 공통 틀(이용 안내(팬)·이용약관 대표 둘) / 공지 / 문의 / 신고.
  소개 탭의 「바꾼 뒤」는 새로 그리지 않고 mockups/about-20261101/ 을 그대로 끼워 넣었다.
  문서형은 긴 화면이라 앞부분만 그렸다(지금 캡처도 같은 길이로 잘라 보인다).
  /public/ 경로는 프로젝트 루트를 서빙할 때 열린다(node scripts/preview.mjs --dir projects/fankkuk).
-->
<style>
@font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Bold.woff') format('woff');font-weight:600 800;font-display:swap}
@font-face{font-family:Pretendard;src:url('/public/images/previews/role-home-unified-v31/Pretendard-Medium.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:Tmoney;src:url('/public/fonts/TmoneyRoundWindExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--bg:#F7F9FB;--card:#fff;--line:#DCE3EA;--panel-line:#CFE2EE;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.04);--ink:#1F2937;--muted:#55606E;--accent:#0369A1;--num:#7F97AC;--sky:#89CFF0;--sky-50:#EEF7FD;--sky-100:#E0F2FE;--field:#6B7280;--sel-line:#6FB8DD;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:var(--ink);font:500 16px/1.6 Pretendard,system-ui,sans-serif;word-break:keep-all}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ===== 비교 페이지 틀 ===== */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.top h1{font:800 18px/1.3 Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;margin-right:auto}
.seg{display:flex;gap:4px;padding:4px;background:#E6EBF0;border-radius:12px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.15);font-weight:700}
.seg-label{font-size:14px;color:var(--muted);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px}
.cmp{padding:24px}
.changes{max-width:1100px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.changes h2{font:800 20px/1.3 Tmoney,Pretendard,sans-serif;margin-bottom:8px}
.changes h2 span{font:500 14px Pretendard;color:var(--muted);margin-left:8px}
.changes ul{padding-left:20px;list-style:disc;font-size:14px;line-height:1.7}
.changes li{margin-top:4px}.changes li span{color:var(--muted)}
.changes .note{margin-top:12px;padding:12px 16px;background:#FFF8E6;border:1px solid #F0D78C;border-radius:12px;font-size:14px;line-height:1.6}
.changes .note b{display:block;margin-bottom:4px}
.changes .note ol{list-style:decimal;padding-left:20px}
.sub{max-width:1100px;margin:0 auto 16px;display:flex;align-items:center;gap:8px}
.panes{display:flex;gap:24px;justify-content:center;align-items:flex-start}
.pane{flex:none}
.pane>h3{font-size:14px;font-weight:700;margin:0 0 8px}
.pane>h3 em{font-style:normal;color:var(--muted);font-weight:500;margin-left:8px}
.shot{background:#fff;border:1px solid var(--line);overflow:hidden}
.shot img{display:block;width:100%;height:auto}

/* ===== 바꾼 뒤 화면 (stage) ===== */
.stage{container:st/inline-size;background:var(--bg);position:relative;font-size:16px}
.stage.white{background:#fff}
.stage img{display:block;max-width:100%}
.stage a{color:inherit;text-decoration:none}
.stage h1,.stage h2{font-family:Tmoney,Pretendard,sans-serif;letter-spacing:-.02em;font-weight:800;line-height:1.3;color:var(--ink)}
.wrap{max-width:928px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:12px;font:700 16px/1 Pretendard,sans-serif;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(180deg,#93D4F2,var(--sky));color:var(--ink);border-color:var(--sel-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn-outline{background:#fff;color:var(--ink);border-color:var(--field);min-height:44px;padding:0 16px}
.ic{width:20px;height:20px;flex:none}
svg{flex:none}

.hd{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font:800 20px/1 Tmoney,sans-serif;min-height:44px}
.logo img{width:32px;height:auto}
.gnb{display:flex;margin-right:auto}
.gnb a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-weight:600}
.gnb a.on{background:var(--sky-50)}
.acct{display:flex;align-items:center;gap:8px}
.acct .lg{display:flex;align-items:center;min-height:44px;padding:0 12px;font-weight:600}
.mbtn{display:none;width:44px;height:44px;border:0;background:none;color:var(--ink);align-items:center;justify-content:center;margin-left:auto}
.ft{margin-top:96px;background:#F1F4F7;border-top:1px solid var(--line);padding:32px 0 40px;font-size:14px;color:var(--muted)}
.ft .r1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px}
.ft .r1 div,.ft .r2{display:flex;gap:8px 24px;flex-wrap:wrap}
.ft .r2{margin-top:8px}
.ft .biz{margin-top:16px;line-height:1.7}
.ft a{display:inline-flex;align-items:center;min-height:32px}

/* ---- 공통 부품 ---- */
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--sky-100);border-color:var(--sel-line);font-weight:700}
.pills{display:flex;gap:8px;flex-wrap:nowrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:var(--sky-100);border:1px solid #BAE0F5;color:#075985;font-family:Pretendard,sans-serif;font-size:12px;font-weight:700;letter-spacing:0;white-space:nowrap}
.page-title{font-size:32px}
.lede{margin-top:8px;font-size:16px;color:var(--muted)}
.cardw{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* ===== 문서형 틀 ===== */
.doc{padding:40px 0 0}
.doc .col{max-width:680px}
.doc h1{font-size:32px;margin-top:32px}
.doc .lead{margin-top:8px;color:var(--muted)}
.doc .meta{display:flex;flex-wrap:wrap;align-items:center;gap:0 16px;margin-top:16px;font-size:14px;color:var(--muted)}
.doc .meta b{color:var(--ink);font-weight:700}
.doc .meta .sep{width:1px;height:12px;background:var(--line)}
.doc .meta a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sum{margin-top:32px;padding:32px;border-radius:24px;border:1px solid var(--panel-line);background:linear-gradient(135deg,var(--sky-50),var(--sky-100));box-shadow:var(--shadow)}
.sum h2{font-size:20px;line-height:1.4}
.sum ol{margin-top:8px;max-width:680px}
.sum li a{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 8px;margin:0 -8px;border-radius:12px;font-weight:600}
.sum li a .n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--ink);font-size:14px;font-weight:700}
.sum li a .go{margin-left:auto;color:var(--accent);width:18px;height:18px}
.tools{margin-top:48px}
.sbox{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;max-width:680px;background:#fff;border:1px solid var(--field);border-radius:12px;color:#5F6B79}
.sbox svg{width:20px;height:20px}
.tools .pills{margin-top:12px}
.tbar{display:flex;align-items:center;gap:8px;margin-top:24px;min-height:48px;max-width:880px;border-bottom:1px solid var(--line);font-size:14px}
.tbar .now{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .bt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;font-weight:600}
.tbar .bt svg{width:18px;height:18px}
.art{padding:40px 0;border-top:1px solid var(--line)}
.tbar+.art{border-top:0;padding-top:32px}
.art .no{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:999px;background:#EEF1F4;color:var(--muted);font-size:12px;font-weight:700}
.art h2{font-size:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.art .no+h2{margin-top:12px}
.prose{max-width:680px;margin-top:16px;color:var(--ink)}
.prose p+p{margin-top:12px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{position:relative;padding-left:40px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky-100);color:var(--ink);font-size:14px;font-weight:700}
.box{max-width:680px;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.box .row{padding:16px 24px}
.box .row+.row{border-top:1px solid var(--line)}
.box dt{font-weight:700}
.box dd{margin-top:4px;color:var(--muted);line-height:1.7}
.box .stg{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline}
.box .stg dd{margin:0;color:var(--ink)}
.stg .k{font-size:12px;font-weight:700;color:var(--muted);margin-right:8px}
.closing{max-width:880px;margin-top:40px;padding:32px;border-radius:24px;border:1px solid var(--panel-line);background:linear-gradient(135deg,var(--sky-50),var(--sky-100))}
.closing h2{font-size:24px}
.closing ol{margin-top:16px}
a.ul{text-decoration:underline;text-underline-offset:3px;font-weight:700}

/* ===== 공지·문의 줄 ===== */
.pg{padding:48px 0 0}
.pg h1{font-size:32px}
.nlist{display:flex;flex-direction:column;gap:16px;margin-top:32px}
.nitem{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.nitem.open{border-color:var(--sel-line)}
.nhead{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 16px 12px 24px}
.nitem.open .nhead{background:var(--sky-50);border-bottom:1px solid var(--panel-line)}
.nhead .tx{flex:1;min-width:0}
.nhead b{display:block;font-size:16px;line-height:1.5}
.nhead time{display:block;font-size:14px;color:var(--muted)}
.nhead .chv{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.nbody{padding:24px;max-width:728px}
.nbody h3{font-size:16px;font-weight:700;margin-bottom:12px}
.nbody p+p{margin-top:12px}
.nbody .sign{font-size:14px;color:var(--muted)}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:48px}
.pager a{display:grid;place-items:center;min-width:44px;height:44px;border-radius:12px;font-weight:600;background:#fff;border:1px solid var(--line)}
.pager a[aria-current]{background:var(--sky-100);border-color:var(--sel-line);font-weight:700}
.pager a.arrow{background:transparent;border-color:transparent;color:var(--muted)}
.faqtabs{margin-top:24px}
.faq{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.faq .nhead{min-height:56px}
.faq .nhead b{font-weight:700}
.faq .ans{padding:16px 24px 24px;max-width:728px}
.faq .ans p+p{margin-top:4px}
.sec{margin-top:64px}
.sec h2{font-size:24px}
.band{margin-top:64px;padding:48px 0;background:#FCF7F1;border-block:1px solid #F0E4D6}
.sky-band .band{background:linear-gradient(180deg,var(--sky-50),#E8F5FD);border-block:1px solid var(--panel-line)}
.band h2{font-size:24px}
.band .btn{margin-top:24px;min-width:240px}
.contact{display:grid;grid-template-columns:auto auto auto;justify-content:start;margin-top:16px}
.contact>div{padding:16px 32px}
.contact>div:first-child{padding-left:24px}
.contact>div+div{border-left:1px solid var(--line)}
.contact dt{font-size:14px;color:var(--muted);font-weight:600}
.contact dd{margin-top:4px;font-size:16px;font-weight:700}
.contact a{display:inline-flex;align-items:center;min-height:44px}

/* ===== 신고 ===== */
.noask{margin-top:8px;font-size:14px;color:var(--muted)}
.form{max-width:680px;margin-top:32px;padding:32px;display:flex;flex-direction:column;gap:24px}
.fld label{display:block;font-weight:700;margin-bottom:8px}
.fld label small{font-size:16px;font-weight:500;color:var(--muted)}
.inp{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:#fff;border:1px solid var(--field);border-radius:12px;color:#5F6B79}
.inp.ta{height:176px;align-items:flex-start;padding-top:12px}
.inp.sel{color:var(--ink)}
.hint{margin-top:8px;font-size:14px;color:var(--muted)}
.send{display:flex;flex-direction:column;gap:12px}
.send .hint{margin:0}
.send .row{display:flex;justify-content:flex-end}
.to{font-size:14px;color:var(--muted)}
.to a{text-decoration:underline;text-underline-offset:3px;font-weight:700;color:var(--ink)}

/* ===== 휴대폰(컨테이너 767 이하) ===== */
@container st (max-width:767px){
  .wrap{padding:0 16px}
  .gnb,.acct{display:none}
  .hd .wrap{height:56px}
  .mbtn{display:flex}
  .page-title,.doc h1,.pg h1{font-size:24px}
  .doc{padding-top:24px}
  .doc h1{margin-top:24px}
  .tabs.pills,.pills.scroll{margin-right:-16px;padding-right:16px;overflow-x:auto;scrollbar-width:none}
  .sum{padding:24px 16px;border-radius:16px}
  .sum li a{align-items:flex-start;padding:8px}
  .tools{margin-top:32px}
  .art{padding:32px 0}
  .art h2,.closing h2,.sec h2,.band h2{font-size:20px}
  .box .row{padding:16px}
  .box .stg{grid-template-columns:96px 1fr;gap:12px}
  .closing{padding:24px 16px;border-radius:16px}
  .pg{padding-top:32px}
  .nlist{margin-top:24px}
  .nhead{padding:8px 8px 8px 16px;gap:8px}
  .nbody,.faq .ans{padding:16px}
  .pager{margin-top:32px}
  .sec,.band{margin-top:48px}
  .band{padding:32px 0}
  .band .btn,.send .btn{width:100%}
  .contact{grid-template-columns:1fr}
  .contact>div{padding:16px;border-left:0!important}
  .contact>div+div{border-top:1px solid var(--line)}
  .form{margin-top:24px;padding:24px 16px}
  .send .row{justify-content:stretch}
  .ft{margin-top:48px}
  .ft .r1{display:block}.ft .r1 div,.ft .r2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .ft a{min-height:44px}
}
</style>
</head>
<body>
<div class="top">
  <h1>팬꾹 7파트 안내·정책 · 시안 4 기준 비교</h1>
  <div class="seg" role="tablist" aria-label="화면" id="tabs"></div>
  <div class="ctl"><span class="seg-label">폭</span>
    <div class="seg" id="widths"><button data-w="1440" aria-pressed="true">PC 1440</button><button data-w="390" aria-pressed="false">휴대폰 390</button></div></div>
  <div class="ctl"><span class="seg-label">보기</span>
    <div class="seg" id="views"><button data-v="both" aria-pressed="true">지금 / 바꾼 뒤</button><button data-v="after" aria-pressed="false">바꾼 뒤만(크게)</button></div></div>
</div>
<div class="cmp">
  <div class="changes" id="changes"></div>
  <div class="sub" id="sub" hidden></div>
  <div class="panes" id="panes"></div>
</div>
<script>
const P={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 chr:'<path d="m9 6 6 6-6 6"/>',chl:'<path d="m15 6-6 6 6 6"/>',
 chd:'<path d="m6 9 6 6 6-6"/>',chu:'<path d="m18 15-6-6-6 6"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'
};
const ic=(n,c='')=>`<svg class="${c}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

const header=on=>`<header class="hd"><div class="wrap"><a class="logo" href="#"><img src="/public/images/logo-mark.png" alt="">팬꾹</a>
 <nav class="gnb" aria-label="주 메뉴">${['크리에이터 찾기','선물 보내기','공지사항','팬꾹 소개','고객센터'].map(t=>`<a ${t===on?'class="on"':''} href="#">${t}</a>`).join('')}</nav>
 <div class="acct"><a class="lg" href="#">로그인</a><a class="btn btn-outline" href="#">회원가입</a></div><button class="mbtn" aria-label="메뉴">${ic('menu')}</button></div></header>`;
const footer=`<footer class="ft"><div class="wrap"><div class="r1"><a class="logo" href="#"><img src="/public/images/logo-mark.png" alt="">팬꾹</a><div><a href="#">이용약관</a><a href="#"><b>개인정보처리방침</b></a><a href="#">취소·환불 규정</a><a href="#">분쟁 처리 안내</a><a href="#">신고·문의</a><a href="#">고객센터</a></div></div>
<div class="r2"><a href="#">팬꾹 소개</a><a href="#">요금 안내</a><a href="#">팬 이용 안내</a><a href="#">크리에이터 이용 안내</a><a href="#">보안 안내</a><a href="#">검수 기준</a><a href="#">자주 묻는 질문</a><a href="#">공지사항</a></div>
<p class="biz">상호 팬꾹 · 대표자 정재원 · 사업자등록번호 260-12-03086 · 통신판매업 신고번호 제2026-서울강남-05946호<br>사업장 주소 서울특별시 강남구 언주로134길 18, 5층 가42호 (논현동, 신승빌딩)<br>고객센터 support@fankkuk.com · 0502-1931-8289 · 호스팅 제공자 Vercel Inc.<br>© 2026 팬꾹. All rights reserved.</p></div></footer>`;

const NOWDIR='now/';
let cur='about',sub='guide',W=1440,V='both',band='sky';
const $=s=>document.querySelector(s);
const tabs=$('#tabs');
Object.entries(SCREENS).forEach(([k,s])=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.k=k;b.setAttribute('role','tab');tabs.append(b)});
const CLIP=2200;
function draw(){
  const t=SCREENS[cur], s=t.sub?t.sub[sub]:t;
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
  document.querySelectorAll('#widths button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===W));
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===V));
  const mark=x=>x.replace(/\(([^)]*\d-\d+[^)]*|충돌 결정[^)]*|28절[^)]*)\)\s*$/,'<span>($1)</span>');
  const route=s.route||t.route;
  $('#changes').innerHTML=`<h2>${t.label}<span>${route}</span></h2><p style="font-size:14px;font-weight:700;margin:0">바뀌는 것</p><ul>${t.changes.map(x=>`<li>${mark(x)}</li>`).join('')}</ul>`
   +(t.decide?`<div class="note"><b>사용자가 정할 것${cur==='about'?' (BACKLOG 「소개 페이지 시안 4 반영 여부」에서 옮김)':''}</b><ol>${t.decide.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'')
   +(t.toggleBand?`<div class="note"><b>사용자가 정할 것</b>1:1 문의 띠 색 — 28절이 정한 크림(지금) 대신 시안 4의 하늘 띠(34절 ③ 소개 띠와 같은 값)로 맞출지. 추천: 하늘 띠. 스위치로 바꿔 볼 수 있다.<div class="seg" id="bands" style="display:inline-flex;margin-left:8px"><button data-b="sky" aria-pressed="${band==='sky'}">하늘 띠(제안)</button><button data-b="cream" aria-pressed="${band==='cream'}">크림(지금)</button></div></div>`:'');
  const subEl=$('#sub');
  if(t.sub){subEl.hidden=false;subEl.innerHTML='<span class="seg-label">대표 화면</span><div class="seg" id="subs">'+Object.entries(t.sub).map(([k,v])=>`<button data-s="${k}" aria-pressed="${k===sub}">${v.label} <span style="color:var(--muted);font-weight:500">${v.route}</span></button>`).join('')+'</div>'}else subEl.hidden=true;
  const n=V==='both'?2:1, avail=document.documentElement.clientWidth-48-24*(n-1);
  const z=Math.min(1,avail/(W*n));
  const nowHtml=`<div class="pane"><h3>지금<em>캡처 · ${W}${cur==='doc'?' · 앞부분만':''}</em></h3><div class="shot" style="width:${W*z}px;max-height:${CLIP*z}px"><img src="${NOWDIR}${s.now}-${W}.jpg" alt="지금 화면 ${W}"></div></div>`;
  let body;
  if(t.after==='iframe') body=`<iframe id="ab" title="소개 시안" src="${ABOUT_AFTER}" style="border:0;width:${W}px;height:1200px;display:block;background:#fff"></iframe>`;
  else body=`<div class="stage ${s.bg==='white'?'white':''} ${band==='sky'?'sky-band':''}" style="width:${W}px" id="stage">${s.render()}</div>`;
  const aft=`<div class="pane"><h3>바꾼 뒤<em>${W}${cur==='about'?' · about-20261101 시안 그대로':cur==='doc'?' · 앞부분만':''}</em></h3><div class="shot" style="width:${W*z}px;${cur==='doc'?`max-height:${CLIP*z}px`:''}"><div style="zoom:${z}">${body}</div></div></div>`;
  $('#panes').innerHTML=(V==='both'?nowHtml:'')+aft;
  const ab=$('#ab');
  if(ab)ab.onload=()=>{try{ab.style.height=ab.contentDocument.documentElement.scrollHeight+'px'}catch(e){}};
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;draw()}};
$('#widths').onclick=e=>{const b=e.target.closest('button');if(b){W=+b.dataset.w;draw()}};
$('#views').onclick=e=>{const b=e.target.closest('button');if(b){V=b.dataset.v;draw()}};
$('#sub').onclick=e=>{const b=e.target.closest('button');if(b){sub=b.dataset.s;draw()}};
$('#changes').onclick=e=>{const b=e.target.closest('#bands button');if(b){band=b.dataset.b;draw()}};

if(q.get('s')&&SCREENS[q.get('s')])cur=q.get('s');if(q.get('sub'))sub=q.get('sub');if(q.get('w'))W=+q.get('w');if(q.get('v'))V=q.get('v');if(q.get('band'))band=q.get('band');
draw();
